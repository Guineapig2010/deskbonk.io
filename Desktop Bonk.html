<script>
// Compact Bonk-style map editor. Maps are edited as the same plain data the built-in maps use,
// rendered live through the real physics builder, test-played against bots, and saved locally.
(function (root) {
  'use strict';
  const DB = root.DB;
  const U = DB.util;
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const TOOLS = [
    ['select', 'Select/Move', 'V'], ['rect', 'Rect', 'R'], ['circle', 'Circle', 'C'], ['poly', 'Polygon', 'P'],
    ['spawn', 'Spawn', 'S'], ['pivot', 'Pivot/Motor', 'J'], ['spring', 'Spring', 'K'], ['path', 'Path', 'M'],
    ['bounds', 'Kill bounds', 'B'], ['delete', 'Delete', 'X'],
  ];

  function blankMap() {
    return {
      id: 'custom_' + Date.now().toString(36), name: 'My Map', category: 'Custom', desc: 'A custom map.',
      view: { w: 60, h: 40 }, bounds: { left: -4, right: 64, top: -30, bottom: 44 },
      bodies: [{ id: 'floor', type: 'static', x: 30, y: 28, a: 0, shapes: [{ t: 'box', w: 36, h: 2 }], friction: 0.6, restitution: 0.15, density: 1 }],
      joints: [], spawns: [[18, 25], [24, 25], [30, 25], [36, 25], [42, 25]], custom: true,
    };
  }

  const E = DB.editor = {
    app: null, map: null, sim: null, tool: 'select', sel: null, drag: null, poly: [], pending: null,
    undo: [], dirty: false, mouse: { x: 0, y: 0 }, snap: 0.5, savedOnce: false,

    open(app, map) {
      this.app = app;
      if (map) this.map = U.deepClone(map);
      else if (!this.map) this.map = blankMap();
      if (app.match && !app.demo) app.match.paused = true;
      app.showScreen('editor');
      this.buildUi();
      this.rebuild();
      app.reportRects(true);
      DB.native.post('setSize', { width: Math.max(app.settings.desktop.width, 900), height: Math.max(app.settings.desktop.height, 620) });
    },
    close() {
      this.teardownUi();
      this.app.showScreen('main');
      this.app.ACTIONS.menu();
      DB.native.post('setSize', { width: this.app.settings.desktop.width, height: this.app.settings.desktop.height });
    },
    teardownUi() {
      for (const id of ['editorBar', 'editorProps', 'editorStatus']) { const el = document.getElementById(id); if (el) el.remove(); }
      const c = $('#game');
      c.onmousedown = c.onmousemove = c.onmouseup = c.ondblclick = null;
    },

    snapshot() { this.undo.push(JSON.stringify(this.map)); if (this.undo.length > 60) this.undo.shift(); this.dirty = true; },
    doUndo() { if (!this.undo.length) return; this.map = JSON.parse(this.undo.pop()); this.sel = null; this.rebuild(); this.renderProps(); },

    rebuild() {
      try {
        this.sim = new DB.Sim({ map: this.map, phys: DB.resolvePhysics(this.app.settings.physics), mode: 'classic', players: [], seed: 1 });
        this.error = null;
      } catch (e) { this.error = String(e.message || e); }
    },

    buildUi() {
      this.teardownUi();
      const app = document.getElementById('app');
      const bar = document.createElement('div');
      bar.id = 'editorBar'; bar.className = 'ia';
      bar.innerHTML = TOOLS.map(([k, n, key]) => `<button data-tool="${k}" title="${n} (${key})">${n}</button>`).join('') +
        `<span style="flex:1"></span><button data-ed="undo" title="Undo (⌘Z)">Undo</button><button data-ed="new">New</button><button data-ed="load">Load…</button><button data-ed="save" class="primary">Save</button><button data-ed="test" class="primary">▶ Test vs bots</button><button data-ed="exit">Exit</button>`;
      app.appendChild(bar);
      const props = document.createElement('div'); props.id = 'editorProps'; props.className = 'ia'; app.appendChild(props);
      const st = document.createElement('div'); st.id = 'editorStatus'; app.appendChild(st);
      bar.addEventListener('click', (e) => {
        const t = e.target.closest('[data-tool]');
        if (t) { this.setTool(t.dataset.tool); return; }
        const a = e.target.closest('[data-ed]');
        if (a) this.action(a.dataset.ed);
      });
      props.addEventListener('change', (e) => this.onProp(e.target));
      props.addEventListener('click', (e) => { const a = e.target.closest('[data-pa]'); if (a) this.propAction(a.dataset.pa, a); });
      const c = $('#game');
      c.onmousedown = (e) => this.onMouse(e, 'down');
      c.onmousemove = (e) => this.onMouse(e, 'move');
      c.onmouseup = (e) => this.onMouse(e, 'up');
      c.ondblclick = (e) => { if (this.tool === 'poly') this.finishPoly(); };
      this.setTool(this.tool);
      this.renderProps();
    },

    setTool(t) {
      this.tool = t; this.poly = []; this.pending = null;
      document.querySelectorAll('#editorBar [data-tool]').forEach((b) => b.classList.toggle('sel', b.dataset.tool === t));
      const tips = {
        select: 'Click to select · drag to move · Delete key removes · arrow keys nudge',
        rect: 'Drag to draw a rectangle platform', circle: 'Drag from the centre to draw a circle',
        poly: 'Click to add points · double-click or Enter to finish (concave shapes are auto-split)',
        spawn: 'Click to place a spawn point (up to 8)', pivot: 'Click a platform to pin it on a pivot (becomes dynamic; add a motor in the panel)',
        spring: 'Click a platform, then click the anchor point — it will ride on a spring', path: 'Select a platform, then click points to make it follow a path (becomes kinematic)',
        bounds: 'Drag a rectangle: leaving it eliminates a player', delete: 'Click a platform, spawn or joint to delete it',
      };
      this.status(tips[t] || '');
    },
    status(msg) { const el = $('#editorStatus'); if (el) el.textContent = msg + (this.error ? '  ⚠ ' + this.error : ''); },

    cam() { return this.app.renderer.camera(this.map, this.rect || { x: 0, y: 30, w: this.app.renderer.W, h: this.app.renderer.H - 30 }); },
    toWorld(e) {
      const r = $('#game').getBoundingClientRect();
      const c = this.cam();
      return { x: (e.clientX - r.left - c.ox) / c.s, y: (e.clientY - r.top - c.oy) / c.s };
    },
    sn(v) { return Math.round(v / this.snap) * this.snap; },

    pick(p) {
      // spawns, joints, then bodies (topmost last-drawn first)
      const m = this.map;
      for (let i = 0; i < m.spawns.length; i++) if (Math.hypot(m.spawns[i][0] - p.x, m.spawns[i][1] - p.y) < 1.1) return { kind: 'spawn', i };
      for (let i = 0; i < m.joints.length; i++) {
        const j = m.joints[i], a = j.anchor || j.anchorA;
        if (a && Math.hypot(a[0] - p.x, a[1] - p.y) < 0.8) return { kind: 'joint', i };
      }
      if (!this.sim) return null;
      let found = null;
      this.sim.world.queryAABB(planck.AABB(planck.Vec2(p.x - 0.01, p.y - 0.01), planck.Vec2(p.x + 0.01, p.y + 0.01)), (fx) => {
        const u = fx.getUserData();
        if (u && u.def && fx.testPoint(planck.Vec2(p.x, p.y))) { found = u.def; }
        return true;
      });
      if (found) { const i = m.bodies.findIndex((b) => b.id === found.id); if (i >= 0) return { kind: 'body', i }; }
      return null;
    },

    onMouse(e, kind) {
      const p = this.toWorld(e);
      this.mouse = p;
      const m = this.map;
      if (kind === 'down') {
        e.preventDefault();
        const t = this.tool;
        if (t === 'select') {
          this.sel = this.pick(p);
          if (this.sel) { this.snapshot(); this.drag = { start: p, orig: JSON.stringify(this.selObj()) }; }
          this.renderProps();
        } else if (t === 'rect' || t === 'circle' || t === 'bounds') {
          this.drag = { start: { x: this.sn(p.x), y: this.sn(p.y) } };
        } else if (t === 'poly') {
          this.poly.push([this.sn(p.x), this.sn(p.y)]);
          this.status(`${this.poly.length} points — double-click or Enter to finish`);
        } else if (t === 'spawn') {
          if (m.spawns.length >= 8) { this.status('Maximum of 8 spawn points'); return; }
          this.snapshot(); m.spawns.push([this.sn(p.x), this.sn(p.y)]); this.rebuild();
        } else if (t === 'delete') {
          const s = this.pick(p);
          if (!s) return;
          this.snapshot();
          if (s.kind === 'spawn') m.spawns.splice(s.i, 1);
          else if (s.kind === 'joint') m.joints.splice(s.i, 1);
          else { const id = m.bodies[s.i].id; m.bodies.splice(s.i, 1); m.joints = m.joints.filter((j) => j.a !== id && j.b !== id); }
          this.sel = null; this.rebuild(); this.renderProps();
        } else if (t === 'pivot') {
          const s = this.pick(p);
          if (!s || s.kind !== 'body') { this.status('Click on a platform to add a pivot'); return; }
          this.snapshot();
          const b = m.bodies[s.i];
          b.type = 'dynamic'; delete b.path; delete b.spin;
          m.joints.push({ t: 'revolute', a: null, b: b.id, anchor: [this.sn(p.x), this.sn(p.y)] });
          this.sel = { kind: 'joint', i: m.joints.length - 1 }; this.rebuild(); this.renderProps();
        } else if (t === 'spring') {
          if (!this.pending) {
            const s = this.pick(p);
            if (!s || s.kind !== 'body') { this.status('Click on a platform first'); return; }
            this.pending = { body: m.bodies[s.i].id, at: [p.x, p.y] };
            this.status('Now click the spring anchor point (usually below the platform)');
          } else {
            this.snapshot();
            const b = m.bodies.find((x) => x.id === this.pending.body);
            b.type = 'dynamic';
            const ax = this.sn(p.x), ay = this.sn(p.y);
            const dx = b.x - ax, dy = b.y - ay, L = Math.hypot(dx, dy) || 1;
            m.joints.push({ t: 'prismatic', a: null, b: b.id, anchor: [b.x, b.y], axis: [dx / L, dy / L], limits: [-L * 0.6, L * 0.4] });
            m.joints.push({ t: 'spring', a: null, b: b.id, anchorA: [ax, ay], anchorB: [b.x, b.y], hz: 0.8, damping: 0.08 });
            b.gravityScale = 0; b.fixedRotation = true;
            this.pending = null; this.sel = { kind: 'joint', i: m.joints.length - 1 }; this.rebuild(); this.renderProps();
            this.setTool('select');
          }
        } else if (t === 'path') {
          if (!this.sel || this.sel.kind !== 'body') {
            const s = this.pick(p);
            if (s && s.kind === 'body') { this.sel = s; this.renderProps(); this.status('Click points for the path; the platform moves between them'); }
            return;
          }
          this.snapshot();
          const b = m.bodies[this.sel.i];
          b.type = 'kinematic';
          m.joints = m.joints.filter((j) => j.b !== b.id);
          b.path = b.path || { pts: [[b.x, b.y]], speed: 4, wait: 0.5, mode: 'pingpong' };
          b.path.pts.push([this.sn(p.x), this.sn(p.y)]);
          this.rebuild(); this.renderProps();
        }
      } else if (kind === 'move') {
        if (!this.drag) return;
        if (this.tool === 'select' && this.sel) {
          const o = JSON.parse(this.drag.orig);
          const dx = this.sn(p.x - this.drag.start.x), dy = this.sn(p.y - this.drag.start.y);
          this.moveSel(o, dx, dy);
          this.rebuild();
        }
      } else if (kind === 'up') {
        const d = this.drag;
        this.drag = null;
        if (!d) return;
        const a = d.start, b = { x: this.sn(p.x), y: this.sn(p.y) };
        if (this.tool === 'rect') {
          const w = Math.abs(b.x - a.x), h = Math.abs(b.y - a.y);
          if (w < 0.5 || h < 0.5) return;
          this.snapshot();
          m.bodies.push({ id: 'b' + Date.now().toString(36), type: 'static', x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, a: 0, shapes: [{ t: 'box', w, h }], friction: 0.6, restitution: 0.15, density: 1 });
          this.sel = { kind: 'body', i: m.bodies.length - 1 }; this.rebuild(); this.renderProps();
        } else if (this.tool === 'circle') {
          const r = Math.hypot(b.x - a.x, b.y - a.y);
          if (r < 0.3) return;
          this.snapshot();
          m.bodies.push({ id: 'b' + Date.now().toString(36), type: 'static', x: a.x, y: a.y, a: 0, shapes: [{ t: 'circle', r: Math.round(r * 10) / 10 }], friction: 0.6, restitution: 0.15, density: 1 });
          this.sel = { kind: 'body', i: m.bodies.length - 1 }; this.rebuild(); this.renderProps();
        } else if (this.tool === 'bounds') {
          if (Math.abs(b.x - a.x) < 4 || Math.abs(b.y - a.y) < 4) return;
          this.snapshot();
          m.bounds = { left: Math.min(a.x, b.x), right: Math.max(a.x, b.x), top: Math.min(a.y, b.y), bottom: Math.max(a.y, b.y) };
          this.rebuild(); this.status('Kill boundary updated');
        }
      }
    },

    selObj() {
      const s = this.sel, m = this.map;
      if (!s) return null;
      return s.kind === 'body' ? m.bodies[s.i] : s.kind === 'joint' ? m.joints[s.i] : m.spawns[s.i];
    },
    moveSel(o, dx, dy) {
      const s = this.sel, m = this.map;
      if (s.kind === 'spawn') { m.spawns[s.i] = [o[0] + dx, o[1] + dy]; return; }
      if (s.kind === 'joint') {
        const j = m.joints[s.i];
        if (o.anchor) j.anchor = [o.anchor[0] + dx, o.anchor[1] + dy];
        if (o.anchorA) j.anchorA = [o.anchorA[0] + dx, o.anchorA[1] + dy];
        return;
      }
      const b = m.bodies[s.i];
      b.x = o.x + dx; b.y = o.y + dy;
      if (o.path) b.path.pts = o.path.pts.map((q) => [q[0] + dx, q[1] + dy]);
      if (o.shapes[0].t === 'poly') { /* polygon points are body-local, nothing to do */ }
      // joints attached to this body move with it
      for (const j of m.joints) if (j.b === b.id && j.anchor && j.t !== 'revolute') { /* keep */ }
    },

    finishPoly() {
      if (this.poly.length < 3) { this.status('A polygon needs at least 3 points'); return; }
      this.snapshot();
      const cx = this.poly.reduce((a, p) => a + p[0], 0) / this.poly.length, cy = this.poly.reduce((a, p) => a + p[1], 0) / this.poly.length;
      const pts = this.poly.map((p) => [p[0] - cx, p[1] - cy]);
      this.map.bodies.push({ id: 'b' + Date.now().toString(36), type: 'static', x: cx, y: cy, a: 0, shapes: [{ t: 'poly', pts }], friction: 0.6, restitution: 0.15, density: 1 });
      this.poly = [];
      this.sel = { kind: 'body', i: this.map.bodies.length - 1 };
      this.rebuild(); this.renderProps();
    },

    onKey(e, down) {
      if (!down) return true;
      const k = e.key;
      if ((e.metaKey || e.ctrlKey) && k.toLowerCase() === 'z') { this.doUndo(); return true; }
      if ((e.metaKey || e.ctrlKey) && k.toLowerCase() === 's') { this.action('save'); return true; }
      if (k === 'Enter' && this.tool === 'poly') { this.finishPoly(); return true; }
      if (k === 'Escape') { if (this.poly.length || this.pending) { this.poly = []; this.pending = null; this.setTool(this.tool); } else this.setTool('select'); return true; }
      if ((k === 'Delete' || k === 'Backspace') && this.sel) {
        this.snapshot();
        const m = this.map, s = this.sel;
        if (s.kind === 'spawn') m.spawns.splice(s.i, 1);
        else if (s.kind === 'joint') m.joints.splice(s.i, 1);
        else { const id = m.bodies[s.i].id; m.bodies.splice(s.i, 1); m.joints = m.joints.filter((j) => j.a !== id && j.b !== id); }
        this.sel = null; this.rebuild(); this.renderProps(); return true;
      }
      if (k.startsWith('Arrow') && this.sel && this.sel.kind === 'body') {
        this.snapshot();
        const b = this.map.bodies[this.sel.i], st = e.shiftKey ? 2 : 0.5;
        const dx = k === 'ArrowLeft' ? -st : k === 'ArrowRight' ? st : 0, dy = k === 'ArrowUp' ? -st : k === 'ArrowDown' ? st : 0;
        this.moveSel(JSON.parse(JSON.stringify(b)), dx, dy);
        this.rebuild(); this.renderProps(); return true;
      }
      const t = TOOLS.find((x) => x[2] === k.toUpperCase());
      if (t && !e.metaKey && !e.ctrlKey) { this.setTool(t[0]); return true; }
      return true; // the editor swallows keys
    },

    // ---------------------------------------------------------- properties ---
    renderProps() {
      const el = $('#editorProps');
      if (!el) return;
      const m = this.map, s = this.sel;
      const num = (k, v, step) => `<input type="number" data-p="${k}" value="${Math.round(v * 100) / 100}" step="${step || 0.5}">`;
      let h = `<div class="form"><label>Name</label><input type="text" data-p="map.name" value="${esc(m.name)}" maxlength="24">
        <label>Info</label><input type="text" data-p="map.desc" value="${esc(m.desc || '')}" maxlength="120"></div>`;
      if (!s) {
        h += `<h3 style="margin:8px 0 4px;font-size:11px">Map</h3><div class="note">${m.bodies.length} platforms · ${m.spawns.length}/8 spawns · ${m.joints.length} joints</div>
          <div class="form" style="margin-top:4px"><label>Gravity ×</label><input type="number" step="0.1" data-p="map.gravityY" value="${m.gravity ? m.gravity[1] : 1}">
          <label>Bounds</label><div class="note">${Math.round(m.bounds.left)},${Math.round(m.bounds.top)} → ${Math.round(m.bounds.right)},${Math.round(m.bounds.bottom)}</div></div>
          <div class="note" style="margin-top:6px">Tip: select a platform to edit friction, bounciness, density, motion and hazards.</div>`;
      } else if (s.kind === 'body') {
        const b = m.bodies[s.i], sh = b.shapes[0];
        h += `<h3 style="margin:8px 0 4px;font-size:11px">Platform</h3><div class="form">
          <label>Type</label><select data-p="type">${['static', 'kinematic', 'dynamic'].map((t) => `<option ${b.type === t ? 'selected' : ''}>${t}</option>`).join('')}</select>
          <label>X</label>${num('x', b.x)}<label>Y</label>${num('y', b.y)}<label>Angle°</label>${num('a', b.a || 0, 5)}
          ${sh.t === 'box' ? `<label>Width</label>${num('w', sh.w)}<label>Height</label>${num('h', sh.h, 0.1)}` : ''}
          ${sh.t === 'circle' ? `<label>Radius</label>${num('r', sh.r, 0.1)}` : ''}
          <label>Friction</label>${num('friction', b.friction != null ? b.friction : 0.6, 0.05)}
          <label>Bounce</label>${num('restitution', b.restitution != null ? b.restitution : 0.15, 0.05)}
          <label>Density</label>${num('density', b.density != null ? b.density : 1, 0.1)}
          <label>Color</label><input type="text" data-p="color" value="${esc(b.color || '')}" placeholder="auto">
          <label>Hazard</label><select data-p="lethal"><option value="false">no</option><option value="true" ${b.lethal ? 'selected' : ''}>lethal</option></select>
          <label>Collides</label><select data-p="decor"><option value="false">yes</option><option value="true" ${b.decor ? 'selected' : ''}>no (decor)</option></select>
          <label>Bumper</label>${num('bumper', b.bumper || 0, 1)}
          ${b.type === 'kinematic' ? `<label>Spin rad/s</label>${num('spin', b.spin || 0, 0.1)}` : ''}
          ${b.type === 'kinematic' && b.path ? `<label>Path speed</label>${num('pathSpeed', b.path.speed || 4, 0.5)}<label>Path wait</label>${num('pathWait', b.path.wait || 0, 0.1)}
            <label>Path mode</label><select data-p="pathMode"><option ${b.path.mode !== 'loop' ? 'selected' : ''}>pingpong</option><option ${b.path.mode === 'loop' ? 'selected' : ''}>loop</option></select>` : ''}
          ${b.type === 'dynamic' ? `<label>Gravity ×</label>${num('gravityScale', b.gravityScale != null ? b.gravityScale : 1, 0.1)}` : ''}
          </div><div class="foot" style="justify-content:flex-start">${b.path ? '<button data-pa="clearpath">Clear path</button>' : ''}<button data-pa="dup">Duplicate</button><button data-pa="mirror">Mirror copy</button></div>`;
      } else if (s.kind === 'joint') {
        const j = m.joints[s.i];
        h += `<h3 style="margin:8px 0 4px;font-size:11px">Joint: ${j.t}</h3><div class="form">`;
        if (j.t === 'revolute') {
          h += `<label>Motor</label><select data-p="j.motorOn"><option value="false">off</option><option value="true" ${j.motor ? 'selected' : ''}>on</option></select>
            ${j.motor ? `<label>Speed</label>${num('j.speed', j.motor.speed, 0.1)}<label>Torque</label>${num('j.torque', j.motor.torque, 100)}` : ''}
            <label>Limits</label><select data-p="j.limOn"><option value="false">free</option><option value="true" ${j.limits ? 'selected' : ''}>limited</option></select>
            ${j.limits ? `<label>Min°</label>${num('j.lo', j.limits[0], 5)}<label>Max°</label>${num('j.hi', j.limits[1], 5)}` : ''}`;
        } else if (j.t === 'spring') {
          h += `<label>Stiffness Hz</label>${num('j.hz', j.hz, 0.1)}<label>Damping</label>${num('j.damping', j.damping, 0.05)}`;
        }
        h += `<label>Break force</label>${num('j.break', j.break || 0, 100)}</div><div class="note">0 = unbreakable</div>`;
      } else {
        h += `<h3 style="margin:8px 0 4px;font-size:11px">Spawn ${s.i + 1}</h3><div class="note">Drag to move · Delete to remove</div>`;
      }
      el.innerHTML = h;
    },

    onProp(t) {
      const k = t.dataset.p;
      if (!k) return;
      const m = this.map;
      this.snapshot();
      const v = t.type === 'number' ? parseFloat(t.value) : t.value;
      if (k === 'map.name') m.name = String(v).slice(0, 24) || 'My Map';
      else if (k === 'map.desc') m.desc = String(v).slice(0, 120);
      else if (k === 'map.gravityY') m.gravity = [0, isFinite(v) ? v : 1];
      else if (this.sel && this.sel.kind === 'body') {
        const b = m.bodies[this.sel.i], sh = b.shapes[0];
        if (k === 'type') {
          b.type = v;
          if (v !== 'kinematic') { delete b.path; delete b.spin; }
          if (v === 'static') m.joints = m.joints.filter((j) => j.b !== b.id);
        } else if (k === 'w' || k === 'h' || k === 'r') { if (isFinite(v) && v > 0.05) sh[k] = v; }
        else if (k === 'lethal' || k === 'decor') b[k] = v === 'true';
        else if (k === 'color') { if (v) b.color = v; else delete b.color; }
        else if (k === 'pathSpeed') { b.path.speed = Math.max(0.2, v); delete b.path._len; }
        else if (k === 'pathWait') b.path.wait = Math.max(0, v);
        else if (k === 'pathMode') b.path.mode = v;
        else if (isFinite(v)) b[k] = v;
      } else if (this.sel && this.sel.kind === 'joint') {
        const j = m.joints[this.sel.i];
        if (k === 'j.motorOn') { if (v === 'true') j.motor = { speed: 1, torque: 2000 }; else delete j.motor; }
        else if (k === 'j.speed') j.motor.speed = v;
        else if (k === 'j.torque') j.motor.torque = Math.max(0, v);
        else if (k === 'j.limOn') { if (v === 'true') j.limits = [-30, 30]; else delete j.limits; }
        else if (k === 'j.lo') j.limits[0] = v;
        else if (k === 'j.hi') j.limits[1] = v;
        else if (k === 'j.hz') j.hz = Math.max(0.05, v);
        else if (k === 'j.damping') j.damping = U.clamp(v, 0, 2);
        else if (k === 'j.break') { if (v > 0) j.break = v; else delete j.break; }
      }
      this.rebuild();
      this.renderProps();
    },

    propAction(a) {
      const m = this.map;
      if (!this.sel || this.sel.kind !== 'body') return;
      this.snapshot();
      const b = m.bodies[this.sel.i];
      if (a === 'clearpath') { delete b.path; }
      else if (a === 'dup' || a === 'mirror') {
        const c = U.deepClone(b);
        c.id = 'b' + Date.now().toString(36);
        if (a === 'dup') { c.x += 2; c.y += 2; if (c.path) c.path.pts = c.path.pts.map((p) => [p[0] + 2, p[1] + 2]); }
        else {
          c.x = m.view.w - c.x; c.a = -(c.a || 0);
          if (c.shapes[0].t === 'poly') c.shapes[0].pts = c.shapes[0].pts.map((p) => [-p[0], p[1]]);
          if (c.path) c.path.pts = c.path.pts.map((p) => [m.view.w - p[0], p[1]]);
          if (c.spin) c.spin = -c.spin;
        }
        m.bodies.push(c);
        this.sel = { kind: 'body', i: m.bodies.length - 1 };
      }
      this.rebuild(); this.renderProps();
    },

    // ------------------------------------------------------------- actions ---
    validate() {
      const m = this.map;
      if (m.spawns.length < 2) return 'Add at least 2 spawn points (8 recommended).';
      if (!m.bodies.some((b) => !b.decor)) return 'Add at least one solid platform.';
      return null;
    },
    action(a) {
      const app = this.app;
      if (a === 'undo') this.doUndo();
      else if (a === 'new') { if (!this.dirty || confirm('Discard this map and start a new one?')) { this.map = blankMap(); this.undo = []; this.sel = null; this.dirty = false; this.rebuild(); this.renderProps(); } }
      else if (a === 'save') {
        const list = DB.store.get('customMaps', []) || [];
        const i = list.findIndex((x) => x.id === this.map.id);
        const clean = JSON.parse(JSON.stringify(this.map, (k, v) => (k.startsWith('_') ? undefined : v)));
        if (i >= 0) list[i] = clean; else list.push(clean);
        DB.store.set('customMaps', list);
        app.loadCustomMaps();
        this.dirty = false;
        app.flash(`Saved “${this.map.name}”`);
      } else if (a === 'load') this.showLoad();
      else if (a === 'test') {
        const err = this.validate();
        if (err) { app.flash(err); return; }
        this.teardownUi();
        app.returnToEditor = true;
        const map = JSON.parse(JSON.stringify(this.map, (k, v) => (k.startsWith('_') ? undefined : v)));
        app.startMatch({ mapId: map.id, rotation: false, mode: 'classic', spectate: false, bots: Math.min(7, Math.max(1, map.spawns.length - 1)), winTarget: 99 }, { map });
        app.flash('Testing — Esc → “Back to editor”');
      } else if (a === 'exit') {
        if (this.dirty && !confirm('Leave without saving?')) return;
        this.close();
      }
    },
    showLoad() {
      const list = DB.store.get('customMaps', []) || [];
      const el = $('#editorProps');
      el.innerHTML = `<h3 style="margin:0 0 6px;font-size:11px">Saved maps</h3>` + (list.length ? list.map((mm, i) => `<div style="display:flex;gap:4px;margin-bottom:4px"><button data-pa="" style="flex:1;text-align:left" data-load="${i}">${esc(mm.name)}</button><button data-del="${i}" title="Delete">✕</button></div>`).join('') : '<div class="note">No saved maps yet.</div>') +
        `<h3 style="margin:8px 0 6px;font-size:11px">Start from a built-in map</h3><select id="edBase">${DB.MAPS.map((mm) => `<option value="${mm.id}">${esc(mm.name)}</option>`).join('')}</select> <button id="edBaseGo">Copy</button>
         <div class="foot"><button id="edBack">Back</button></div>`;
      el.querySelectorAll('[data-load]').forEach((b) => b.onclick = () => { this.map = U.deepClone(list[+b.dataset.load]); this.undo = []; this.sel = null; this.dirty = false; this.rebuild(); this.renderProps(); });
      el.querySelectorAll('[data-del]').forEach((b) => b.onclick = () => { if (confirm('Delete this map?')) { list.splice(+b.dataset.del, 1); DB.store.set('customMaps', list); this.app.loadCustomMaps(); this.showLoad(); } });
      $('#edBaseGo').onclick = () => {
        const base = DB.normalizeMap(DB.getMap($('#edBase').value));
        const copy = JSON.parse(JSON.stringify(base, (k, v) => (k.startsWith('_') ? undefined : v)));
        copy.id = 'custom_' + Date.now().toString(36); copy.name = base.name + ' (copy)'; copy.category = 'Custom'; copy.custom = true;
        this.map = copy; this.undo = []; this.sel = null; this.dirty = true; this.rebuild(); this.renderProps();
      };
      $('#edBack').onclick = () => this.renderProps();
    },

    // -------------------------------------------------------------- drawing ---
    draw(renderer, rect) {
      this.rect = rect;
      const ctx = renderer.ctx;
      if (this.sim) {
        const prev = renderer.opts.background;
        renderer.opts.background = 'translucent';
        renderer.draw({ sim: this.sim }, 1, rect);
        renderer.opts.background = prev;
      } else {
        ctx.setTransform(renderer.dpr, 0, 0, renderer.dpr, 0, 0);
        ctx.clearRect(0, 0, renderer.W, renderer.H);
      }
      const c = this.cam(), m = this.map;
      ctx.save();
      ctx.setTransform(renderer.dpr, 0, 0, renderer.dpr, 0, 0);
      ctx.translate(c.ox, c.oy); ctx.scale(c.s, c.s);
      const px = 1 / c.s;
      // grid
      ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.lineWidth = px;
      for (let x = 0; x <= m.view.w; x += 2) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, m.view.h); ctx.stroke(); }
      for (let y = 0; y <= m.view.h; y += 2) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(m.view.w, y); ctx.stroke(); }
      // kill bounds
      const B = m.bounds;
      ctx.strokeStyle = 'rgba(255,80,80,0.9)'; ctx.setLineDash([5 * px, 4 * px]); ctx.lineWidth = 1.5 * px;
      ctx.strokeRect(B.left, B.top, B.right - B.left, B.bottom - B.top); ctx.setLineDash([]);
      // spawns
      m.spawns.forEach((sp, i) => {
        ctx.beginPath(); ctx.arc(sp[0], sp[1], 1, 0, U.TAU);
        ctx.fillStyle = 'rgba(255,230,90,0.35)'; ctx.fill(); ctx.strokeStyle = '#ffe65a'; ctx.lineWidth = 1.5 * px; ctx.stroke();
        ctx.save(); ctx.translate(sp[0], sp[1]); ctx.scale(px, px); ctx.fillStyle = '#ffe65a'; ctx.font = '700 10px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(String(i + 1), 0, 0); ctx.restore();
      });
      // joints
      m.joints.forEach((j, i) => {
        const a = j.anchor || j.anchorA;
        if (!a) return;
        ctx.beginPath(); ctx.arc(a[0], a[1], 0.6, 0, U.TAU);
        ctx.strokeStyle = j.t === 'spring' ? '#7dffb0' : '#ffffff'; ctx.lineWidth = 1.5 * px; ctx.stroke();
        if (j.motor) { ctx.beginPath(); ctx.arc(a[0], a[1], 0.95, -1, 1.6); ctx.stroke(); }
      });
      // path points
      for (const b of m.bodies) if (b.path) {
        ctx.strokeStyle = '#8fd3ff'; ctx.lineWidth = 1.2 * px; ctx.beginPath();
        b.path.pts.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); ctx.stroke();
        for (const p of b.path.pts) { ctx.fillStyle = '#8fd3ff'; ctx.fillRect(p[0] - 0.25, p[1] - 0.25, 0.5, 0.5); }
      }
      // selection highlight
      const s = this.sel;
      if (s) {
        ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 2 * px; ctx.setLineDash([4 * px, 3 * px]);
        if (s.kind === 'body' && this.sim) {
          const def = m.bodies[s.i];
          const body = this.sim.env.bodies[def.id];
          if (body) {
            let lo = [1e9, 1e9], hi = [-1e9, -1e9];
            for (let f = body.getFixtureList(); f; f = f.getNext()) { const bb = f.getAABB(0); lo = [Math.min(lo[0], bb.lowerBound.x), Math.min(lo[1], bb.lowerBound.y)]; hi = [Math.max(hi[0], bb.upperBound.x), Math.max(hi[1], bb.upperBound.y)]; }
            ctx.strokeRect(lo[0] - 0.3, lo[1] - 0.3, hi[0] - lo[0] + 0.6, hi[1] - lo[1] + 0.6);
          }
        } else if (s.kind === 'spawn') { const sp = m.spawns[s.i]; ctx.beginPath(); ctx.arc(sp[0], sp[1], 1.4, 0, U.TAU); ctx.stroke(); }
        else if (s.kind === 'joint') { const j = m.joints[s.i], a = j.anchor || j.anchorA; ctx.beginPath(); ctx.arc(a[0], a[1], 1.1, 0, U.TAU); ctx.stroke(); }
        ctx.setLineDash([]);
      }
      // in-progress drawing
      const mp = { x: this.sn(this.mouse.x), y: this.sn(this.mouse.y) };
      ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 1.5 * px;
      if (this.drag && (this.tool === 'rect' || this.tool === 'bounds')) { const a = this.drag.start; ctx.strokeRect(Math.min(a.x, mp.x), Math.min(a.y, mp.y), Math.abs(mp.x - a.x), Math.abs(mp.y - a.y)); }
      if (this.drag && this.tool === 'circle') { const a = this.drag.start; ctx.beginPath(); ctx.arc(a.x, a.y, Math.hypot(mp.x - a.x, mp.y - a.y), 0, U.TAU); ctx.stroke(); }
      if (this.poly.length) { ctx.beginPath(); this.poly.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); ctx.lineTo(mp.x, mp.y); ctx.stroke(); }
      if (this.pending) { ctx.beginPath(); ctx.moveTo(this.pending.at[0], this.pending.at[1]); ctx.lineTo(mp.x, mp.y); ctx.stroke(); }
      ctx.restore();
    },
  };
})(window);

</script>
<script>
// Application shell: main loop, keyboard input, HUD, menus, settings, desktop-overlay integration.
(function (root) {
  'use strict';
  const DB = root.DB;
  const U = DB.util;
  const C = DB.CONST;
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const App = DB.app = {
    settings: null, match: null, demo: false, renderer: null, screen: 'main', screenArg: null,
    focused: true, hidden: false, keys: {}, acc: 0, last: 0, lastDraw: 0, thumbs: {}, ff: false,
    goTimer: 0, hudTick: 0, lastRects: '', returnToEditor: false, hintTimer: 0, settingsTab: 'match',
  };

  // ---------------------------------------------------------------- settings ----
  function loadSettings() {
    const s = U.deepClone(DB.DEFAULT_SETTINGS);
    U.deepMerge(s, DB.store.get('settings', {}) || {});
    return s;
  }
  function saveSettings() { DB.store.set('settings', App.settings); applySettings(); }
  App.saveSettings = saveSettings;

  function applySettings() {
    const d = App.settings.desktop;
    App.renderer.setOptions({ background: d.background, platformStyle: d.platformStyle, outlineColor: d.outlineColor, showNames: d.showNames, showBounds: d.showBounds });
    DB.audio.settings = App.settings.audio; DB.audio.apply();
    DB.native.post('setLevel', { alwaysOnTop: !!d.alwaysOnTop });
    DB.native.post('setHideOnDeactivate', { hide: !d.visibleWhenInactive });
    DB.native.post('setClickThrough', { enabled: !!d.clickThrough });
    DB.native.post('setHotkeys', { toggle: d.hotkeyToggle, focus: d.hotkeyFocus });
    reportRects(true);
  }

  function loadCustomMaps() {
    DB.customMaps = (DB.store.get('customMaps', []) || []).filter((m) => m && m.id && m.bodies);
  }
  App.loadCustomMaps = loadCustomMaps;

  // ------------------------------------------------------------------ matches ----
  function matchConfig(overrides) {
    const s = App.settings;
    const ms = Object.assign({}, s.match, overrides || {});
    const roster = DB.buildRoster(Object.assign({}, s, { match: ms }));
    return {
      mode: ms.mode, roster, mapId: ms.mapId, rotation: ms.rotation, winTarget: ms.winTarget,
      phys: DB.resolvePhysics(s.physics), includeCustom: true,
    };
  }

  function startMatch(overrides, opts) {
    opts = opts || {};
    DB.audio.ensure();
    const cfg = matchConfig(overrides);
    if (opts.map) cfg.mapId = opts.map.id;
    App.match = new DB.Match(cfg);
    App.demo = !!opts.demo;
    App.match.on(onMatchEvent);
    if (opts.map && !DB.getMap(opts.map.id)) { App.match.start = function () { this.round = 0; this.matchWinner = null; this.nextRound(opts.map); }; App.match.pickMap = () => opts.map; }
    App.match.start();
    App.acc = 0;
    App.renderer.effects = [];
    if (!App.demo) { showScreen(null); DB.audio.ui('round'); requestFocus(); }
    App.hintTimer = 5;
  }
  App.startMatch = startMatch;

  function quickMatch() {
    // Quick Match: 1 human + 5 bots, Normal, random map rotation, Classic, first to 5 — unless the user changed defaults.
    const q = App.settings.quick || {};
    startMatch(Object.assign({ mode: 'classic', bots: 5, difficulty: 3, personality: 'mixed', mapId: 'random', rotation: true, winTarget: 5, spectate: false }, q));
  }
  App.quickMatch = quickMatch;

  function startDemo() {
    const pool = DB.MAPS;
    const map = pool[(Math.random() * pool.length) | 0];
    startMatch({ mode: 'classic', bots: 5, difficulty: 4, personality: 'mixed', mapId: map.id, rotation: true, winTarget: 999, spectate: true }, { demo: true });
  }

  function onMatchEvent(e) {
    if (App.demo) return;
    if (e.type === 'go') { App.goTimer = 0.7; DB.audio.ui('go'); }
    else if (e.type === 'roundEnd') DB.audio.ui(e.matchWinner ? 'win' : 'round');
    else if (e.type === 'roundStart') App.hintTimer = Math.max(App.hintTimer, 3.5);
  }

  // -------------------------------------------------------------------- input ----
  const KEYMAP = {
    ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', KeyX: 'heavy', KeyZ: 'special',
  };
  const WASD = { KeyA: 'left', KeyD: 'right', KeyW: 'up', KeyS: 'down' };

  function isTyping(e) {
    const t = e.target;
    return t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA');
  }
  function updateHumanInput() {
    if (!App.match) return;
    const inp = App.match.humanInput;
    for (const k of ['left', 'right', 'up', 'down', 'heavy', 'special']) inp[k] = false;
    if (!App.focused) return;
    for (const code in App.keys) {
      if (!App.keys[code]) continue;
      const a = KEYMAP[code] || (App.settings.controls.wasd ? WASD[code] : null);
      if (a) inp[a] = true;
    }
  }
  function onKeyDown(e) {
    DB.audio.ensure();
    if (isTyping(e)) { if (e.code === 'Escape') e.target.blur(); return; }
    if (App.screen === 'editor' && DB.editor && DB.editor.onKey(e, true)) { e.preventDefault(); return; }
    const gameKey = KEYMAP[e.code] || (App.settings.controls.wasd && WASD[e.code]);
    if (gameKey || e.code === 'Space') e.preventDefault();
    App.keys[e.code] = true;
    if (e.code === 'Space') App.ff = true;
    if (e.code === 'Escape') {
      e.preventDefault();
      if (App.screen === 'editor') return;
      if (App.screen && App.screen !== 'main' && App.match && !App.demo) { showScreen(null); return; }
      if (App.screen === null && App.match && !App.demo) { showScreen('pause'); return; }
      if (App.screen && App.screen !== 'main') { showScreen('main'); return; }
    }
    if (e.code === 'Enter' && !e.repeat) {
      if (App.screen === 'main') { quickMatch(); e.preventDefault(); }
      else if (App.match && App.match.state === 'matchEnd' && !App.demo) { App.match.rematch(); e.preventDefault(); }
    }
    updateHumanInput();
  }
  function onKeyUp(e) {
    App.keys[e.code] = false;
    if (e.code === 'Space') App.ff = false;
    if (App.screen === 'editor' && DB.editor) DB.editor.onKey(e, false);
    updateHumanInput();
  }
  function releaseAllKeys() { App.keys = {}; App.ff = false; updateHumanInput(); }

  function setFocused(f) {
    App.focused = f;
    if (!f) releaseAllKeys();
    document.body.classList.toggle('unfocused', !f);
  }
  function requestFocus() {
    if (!DB.native.post('focus')) { try { window.focus(); } catch (e) { /* ignore */ } }
    setFocused(true);
  }
  App.requestFocus = requestFocus;

  // ---------------------------------------------------------------------- loop ----
  function frame(ts) {
    requestAnimationFrame(frame);
    const fpsLimit = App.settings.desktop.fpsLimit || 60;
    if (fpsLimit < 120 && ts - App.lastDraw < 1000 / fpsLimit - 2) return;
    const dt = Math.min(0.1, (ts - (App.last || ts)) / 1000);
    App.last = ts; App.lastDraw = ts;
    const m = App.match;
    const pausedByMenu = App.screen && App.screen !== 'main' && !App.demo;
    const pausedByBlur = !App.focused && App.settings.desktop.pauseOnBlur && !App.demo && !!m && m.state !== 'matchEnd' && !App.noBlurPause;
    const paused = App.hidden || pausedByMenu || pausedByBlur || App.screen === 'editor';
    if (m && !paused) {
      const human = m.human();
      const spectating = !human || !human.alive || App.demo;
      const speed = App.ff && spectating ? 3 : 1;
      App.acc += dt * speed;
      let n = 0;
      while (App.acc >= C.DT && n < 6 * speed) { m.step(C.DT); App.acc -= C.DT; n++; }
      if (n >= 6 * speed) App.acc = 0;
      for (const e of m.events) { App.renderer.addEvent(e); if (!App.demo) DB.audio.event(e); }
      m.events.length = 0;
      if (App.demo && m.state === 'roundEnd' && m.round > 2) { /* keep the demo rolling */ }
    }
    const rect = arenaRect();
    if (App.screen === 'editor' && DB.editor) DB.editor.draw(App.renderer, rect);
    else App.renderer.draw(m, U.clamp(App.acc / C.DT, 0, 1), rect);
    App.goTimer = Math.max(0, App.goTimer - dt);
    App.hintTimer = Math.max(0, App.hintTimer - dt);
    updateHud(dt);
  }

  function arenaRect() {
    const top = 30;
    return { x: 0, y: top, w: App.renderer.W, h: App.renderer.H - top };
  }

  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    App.renderer.resize(w, h, window.devicePixelRatio || 1);
    document.body.classList.toggle('compact', w < 560);
    reportRects(true);
  }

  // ----------------------------------------------------------------------- HUD ----
  function updateHud(dt) {
    const m = App.match;
    const hud = $('#hud');
    const show = m && !App.demo && App.screen !== 'editor';
    hud.style.display = show ? '' : 'none';
    document.body.classList.toggle('playing', !!(show && m.state === 'playing'));
    $('#focusHint').classList.toggle('hidden', !(show && !App.focused && m.state !== 'matchEnd' && !App.screen));
    if (!show) { reportRects(); return; }
    const sim = m.sim;
    // heavy meter
    const h = m.human();
    const hv = $('#heavy');
    if (h && h.alive) {
      hv.style.display = '';
      $('#heavyFill').style.width = Math.round(h.heavyEnergy * 100) + '%';
      hv.classList.toggle('active', !!h.heavy);
    } else hv.style.display = 'none';
    // throttle the rest
    App.hudTick -= dt;
    if (App.hudTick > 0) return;
    App.hudTick = 0.1;
    const scores = $('#scores');
    let html = '';
    if (m.teams) {
      for (const t of [1, 2]) {
        const alive = sim.players.filter((p) => p.team === t && p.alive).length;
        html += `<div class="chip"><span class="dot" style="background:${DB.TEAM_COLORS[t]}"></span>${t === 1 ? 'Red' : 'Blue'} <span class="pips">${m.scores[t]}</span><span class="note">${m.mode === 'football' ? '' : alive + ' left'}</span></div>`;
      }
    } else {
      const list = sim.players.slice().sort((a, b) => (m.scores[b.id] || 0) - (m.scores[a.id] || 0));
      for (const p of list) {
        html += `<div class="chip ${p.alive ? '' : 'dead'} ${p.isHuman ? 'me' : ''}"><span class="dot" style="background:${p.color}"></span>${esc(p.name)} <span class="pips">${m.scores[p.id] || 0}</span></div>`;
      }
    }
    html += `<div class="note" style="padding-left:4px;text-shadow:0 1px 1px #000">First to ${m.winTarget} · Round ${m.round}</div>`;
    if (scores.innerHTML !== html) scores.innerHTML = html;
    const mapName = `${esc(m.map.name)} · ${esc(DB.MODES[m.mode].name)}${sim.overtime ? ' · <b style="color:#ff6b6b">OVERTIME</b>' : ''}`;
    if ($('#mapName').innerHTML !== mapName) $('#mapName').innerHTML = mapName;
    // centre messages
    let c = '';
    if (m.state === 'countdown') c = `<div class="big">${Math.max(1, Math.ceil(m.timer / (C.COUNTDOWN / 3)))}</div><div class="banner" style="padding:4px 10px;min-width:0"><b>${esc(m.map.name)}</b><div class="sub">${esc(m.map.desc || '')}</div></div>`;
    else if (App.goTimer > 0) c = '<div class="big">BONK!</div>';
    else if (m.state === 'roundEnd' || m.state === 'matchEnd') {
      const r = m.lastResult;
      let title = 'Draw!';
      let color = '#fff';
      if (r && r.type === 'player') { title = `${esc(r.player.name)} wins the round`; color = r.player.color; }
      if (r && r.type === 'team') { title = `${r.team === 1 ? 'Red' : 'Blue'} ${r.goal ? 'scores!' : 'team wins the round'}`; color = DB.TEAM_COLORS[r.team]; }
      if (r && r.timeout) title = 'Time up — draw';
      let table = '';
      const rows = m.teams ? [1, 2].map((t) => [t === 1 ? 'Red' : 'Blue', m.scores[t], DB.TEAM_COLORS[t]])
        : m.roster.map((p) => [p.name, m.scores[p.id] || 0, p.color, m.kills[p.id] || 0]).sort((a, b) => b[1] - a[1]);
      table = '<table>' + rows.map((rw) => `<tr><td><span class="dot" style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${rw[2]};border:1px solid #000"></span> ${esc(rw[0])}</td><td><b>${rw[1]}</b></td>${rw[3] != null ? `<td class="note">${rw[3]} KO</td>` : ''}</tr>`).join('') + '</table>';
      if (m.state === 'matchEnd' || m.matchWinner) {
        const w = m.matchWinner;
        const wname = esc(m.winnerName(w.key));
        const wcol = m.teams ? DB.TEAM_COLORS[w.key] : (m.roster.find((p) => p.id === w.key) || {}).color;
        c = `<div class="banner"><h2 style="color:${wcol}">${wname} win${m.teams ? '' : 's'} the match!</h2>${table}
          <div class="row ia"><button class="primary" data-a="rematch">Rematch</button><button data-a="newmap">New map</button><button data-a="menu">Menu</button>${App.returnToEditor ? '<button data-a="backeditor">Editor</button>' : '<button data-a="minimize">Minimize</button>'}</div></div>`;
        if (m.state !== 'matchEnd') c = `<div class="banner"><h2 style="color:${wcol}">${wname} win${m.teams ? '' : 's'} the match!</h2>${table}</div>`;
      } else {
        c = `<div class="banner"><h2 style="color:${color}">${title}</h2>${table}<div class="sub">Next round in ${Math.ceil(m.timer + C.COUNTDOWN)}…</div></div>`;
      }
    } else if (h && !h.alive && m.state === 'playing') {
      c = `<div class="banner" style="padding:5px 12px;min-width:0"><b>Bonked!</b> <span class="sub">Hold <span class="kbd">Space</span> to fast-forward · <span class="kbd">Esc</span> menu</span></div>`;
    }
    const center = $('#center');
    if (center.innerHTML !== c) { center.innerHTML = c; reportRects(true); }
    const hints = {
      classic: '← → ↑ ↓ move · hold <span class="kbd">X</span> heavy · <span class="kbd">Esc</span> menu',
      teams: 'Red vs Blue · ← → ↑ ↓ move · hold <span class="kbd">X</span> heavy',
      arrows: 'Hold <span class="kbd">Z</span>, aim ← →, release to fire · <span class="kbd">X</span> heavy',
      grapple: 'Hold <span class="kbd">Z</span> + direction to grapple · ↑ ↓ reel · <span class="kbd">X</span> heavy',
      football: 'Push the ball into the other goal · <span class="kbd">Z</span> kick · <span class="kbd">X</span> heavy',
    };
    const hint = $('#hint');
    const hh = hints[m.mode] || '';
    if (hint.innerHTML !== hh) hint.innerHTML = hh;
    hint.style.opacity = App.hintTimer > 0 || m.state === 'countdown' ? 1 : 0;
    reportRects();
  }

  // ---------------------------------------------------- click-through regions ----
  // The host makes the window ignore mouse events except over these rectangles, so clicks on the
  // transparent parts of the arena fall through to Safari (or whatever is underneath).
  function reportRects(force) {
    if (!DB.native.isNative) return;
    const all = App.screen === 'editor';
    const rects = [];
    if (!all) {
      document.querySelectorAll('.ia').forEach((el) => {
        if (el.offsetParent === null && el.id !== 'panel') return;
        if (el.classList.contains('hidden')) return;
        const r = el.getBoundingClientRect();
        if (r.width > 0 && r.height > 0) rects.push([Math.floor(r.left) - 2, Math.floor(r.top) - 2, Math.ceil(r.width) + 4, Math.ceil(r.height) + 4]);
      });
    }
    const key = (all ? 'all' : '') + JSON.stringify(rects);
    if (!force && key === App.lastRects) return;
    App.lastRects = key;
    DB.native.post('interactive', { rects, all });
  }
  App.reportRects = reportRects;

  // ----------------------------------------------------------------- screens ----
  const DIFF_NAMES = ['', 'Beginner', 'Casual', 'Normal', 'Skilled', 'Expert', 'Insane'];

  }

    return `<div class="seg"><button data-a="set" data-k="${name}" data-v="true" class="${cur ? 'sel' : ''}">${label ? label[0] : 'On'}</button><button data-a="set" data-k="${name}" data-v="false" class="${!cur ? 'sel' : ''}">${label ? label[1] : 'Off'}</button></div>`;
  }
  function range(name, cur, min, max, step) {
    return `<div style="display:flex;align-items:center"><input type="range" data-k="${name}" min="${min}" max="${max}" step="${step}" value="${cur}"><span class="val">${cur}</span></div>`;
  }

        const a = s.audio;
        body = `<div class="form">
          <label>Master volume</label>${range('audio.master', a.master, 0, 1, 0.05)}
          <label>Collision sounds</label>${toggle('audio.collisions', a.collisions)}
          <label>Interface sounds</label>${toggle('audio.ui', a.ui)}
          <label>Mute</label>${toggle('audio.mute', a.mute)}
        </div>`;
      } else {
        const d = s.desktop;
        const presets = ['ctrl+alt+b', 'ctrl+cmd+b', 'cmd+shift+b', 'ctrl+alt+space', 'none'];
        const fpresets = ['ctrl+alt+g', 'ctrl+cmd+g', 'cmd+shift+g', 'none'];
        body = `<div class="form">
          <label>WASD</label>${toggle('controls.wasd', s.controls.wasd, ['Enabled', 'Arrows only'])}
          <label>Show / hide</label>${seg('desktop.hotkeyToggle', presets, d.hotkeyToggle, fmtHot)}
          <label>Focus game</label>${seg('desktop.hotkeyFocus', fpresets, d.hotkeyFocus, fmtHot)}
        </div>
        <div class="help" style="margin-top:8px">In game: ← → ↑ ↓ move · X heavy · Z special · Esc pause · Enter quick match / rematch · Space fast-forward when spectating. Global shortcuts work from any app (no Accessibility permission needed).</div>`;
      }
      return `<h1>Settings</h1><div class="tabs">${tabs.map((x) => `<button data-a="tab" data-v="${x}" class="${t === x ? 'sel' : ''}">${x[0].toUpperCase() + x.slice(1)}</button>`).join('')}</div>${body}
        <div class="foot"><button data-a="resetall">Reset all settings</button><button class="primary" data-a="back">Done</button></div>`;
    },
  };

  function fmtHot(h) {
    if (!h || h === 'none') return 'None';
    return h.split('+').map((k) => ({ ctrl: '⌃', alt: '⌥', cmd: '⌘', shift: '⇧', space: 'Space' }[k] || k.toUpperCase())).join('');
  }

  function showScreen(name, arg) {
    const prev = App.screen;
    if (name && name !== 'settings' && name !== 'maps') App.prevScreen = name;
    if (name === 'settings' || name === 'maps') App.backTo = prev && prev !== name ? prev : App.backTo || 'main';
    App.screen = name;
    App.screenArg = arg;
    const panel = $('#panel');
    if (!name || name === 'editor') { panel.classList.add('hidden'); panel.innerHTML = ''; reportRects(true); return; }
    panel.innerHTML = SCREENS[name](arg);
    panel.classList.remove('hidden');
    panel.scrollTop = 0;
    if (name === 'maps') loadThumbs();
    releaseAllKeys();
    reportRects(true);
  }
  App.showScreen = showScreen;

  function loadThumbs() {
    const imgs = Array.from(document.querySelectorAll('img[data-thumb]'));
    let i = 0;
    const next = () => {
      if (i >= imgs.length || App.screen !== 'maps') return;
      const img = imgs[i++];
      const id = img.getAttribute('data-thumb');
      if (!App.thumbs[id]) { const m = DB.getMap(id); if (m) { try { App.thumbs[id] = DB.Renderer.thumbnail(m, 120, 80); } catch (e) { console.error('thumb', id, e); } } }
      if (App.thumbs[id]) img.src = App.thumbs[id];
      setTimeout(next, 0);
    };
    next();
  }

  function setPath(obj, path, val) {
    const parts = path.split('.');
    let o = obj;
    for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]] = o[parts[i]] || {};
    const k = parts[parts.length - 1];
    const old = o[k];
    if (typeof old === 'number') val = Number(val);
    else if (typeof old === 'boolean') val = val === true || val === 'true';
    else if (val === 'true' || val === 'false') val = val === 'true';
    else if (!isNaN(val) && val !== '' && typeof old !== 'string') val = Number(val);
    o[k] = val;
  }

  function onSetting(key, val) {
    if (key === 'match.spectate') val = !(val === true || val === 'true'); // toggle labelled "You + bots"
    setPath(App.settings, key, val);
    const s = App.settings;
    if (key === 'match.spectate') s.match.bots = s.match.spectate ? Math.max(2, s.match.bots) : Math.min(7, Math.max(1, s.match.bots));
    if (key === 'match.winTarget') s.match.winTarget = U.clamp(Math.round(s.match.winTarget) || 5, 1, 99);
    if (key.startsWith('physics.') && key !== 'physics.preset' && key !== 'physics.custom') s.physics.custom = true;
    if (key === 'physics.custom' && s.physics.custom) {
      const eff = DB.resolvePhysics({ preset: s.physics.preset });
      for (const k of ['gravity', 'moveAccel', 'upAccel', 'downAccel', 'frictionMul', 'restitutionMul', 'heavyMass', 'heavyDrain', 'heavyRecover']) if (s.physics[k] == null) s.physics[k] = eff[k];
    }
    if (key === 'desktop.size' && DB.SIZE_PRESETS[val]) { s.desktop.width = DB.SIZE_PRESETS[val].width; s.desktop.height = DB.SIZE_PRESETS[val].height; DB.native.post('setSize', { width: s.desktop.width, height: s.desktop.height }); }
    if (key === 'desktop.width' || key === 'desktop.height') { s.desktop.size = 'custom'; DB.native.post('setSize', { width: s.desktop.width, height: s.desktop.height }); }
    if (key === 'desktop.position') DB.native.post('setPosition', { preset: val });
    if (key === 'playerName') s.playerName = String(val).slice(0, 14) || 'You';
    saveSettings();
  }

  const ACTIONS = {
    quick: () => quickMatch(),
    go: (el) => showScreen(el.dataset.v, el.dataset.arg),
    back: () => {
      if (App.backTo === 'pause' && App.match && !App.demo) showScreen('pause');
      else if (App.backTo === 'custom') showScreen('custom');
      else showScreen('main');
    },
    tab: (el) => { App.settingsTab = el.dataset.v; showScreen('settings'); },
    set: (el) => { onSetting(el.dataset.k, el.dataset.v); showScreen(App.screen, App.screenArg); },
    startcustom: () => { const ms = App.settings.match; startMatch(Object.assign({}, ms)); },
    setquick: () => { const ms = App.settings.match; App.settings.quick = { mode: ms.mode, bots: ms.spectate ? 5 : ms.bots, difficulty: ms.difficulty, personality: ms.personality, winTarget: ms.winTarget, mapId: ms.mapId, rotation: ms.rotation, spectate: false }; saveSettings(); flash('Quick Match defaults saved'); },
    resetquick: () => { delete App.settings.quick; saveSettings(); flash('Quick Match reset to defaults'); },
    pickmap: (el) => {
      App.settings.match.mapId = el.dataset.v; saveSettings();
      if (App.backTo === 'pause' && App.match && !App.demo) {
        // change map immediately in the running match
        App.match.cfg.mapId = el.dataset.v; App.match.fixedMapId = el.dataset.v; App.match.nextRound(DB.getMap(el.dataset.v)); App.match.round--; showScreen(null);
      } else showScreen('custom');
    },
    playmap: (el) => {
      const m = DB.getMap(el.dataset.v);
      const football = m && (m.goals || (m.modes || []).indexOf('football') >= 0);
      startMatch({ mapId: el.dataset.v, rotation: false, mode: football ? 'football' : (App.settings.match.mode === 'football' ? 'classic' : App.settings.match.mode), spectate: false, bots: App.settings.match.spectate ? 5 : App.settings.match.bots });
    },
    resume: () => { showScreen(null); requestFocus(); },
    rematch: () => { if (App.match && !App.demo) { App.match.rematch(); showScreen(null); requestFocus(); } },
    skipround: () => { if (App.match && !App.demo) { App.match.nextRound(); showScreen(null); } },
    newmap: () => { if (App.match) { App.match.cfg.mapId = 'random'; App.match.fixedMapId = null; App.match.rematch(); requestFocus(); } },
    menu: () => { App.returnToEditor = false; showScreen('main'); startDemo(); },
    minimize: () => { DB.native.post('minimize'); },
    quit: () => { DB.native.post('quit'); },
    editor: () => { if (DB.editor) DB.editor.open(App); },
    backeditor: () => { App.returnToEditor = false; App.match = null; DB.editor.open(App); },
    resetall: () => { if (confirm('Reset all settings to defaults?')) { App.settings = U.deepClone(DB.DEFAULT_SETTINGS); saveSettings(); showScreen('settings'); } },
  };
  App.ACTIONS = ACTIONS;

  function flash(msg) {
    const el = document.createElement('div');
    el.className = 'banner';
    el.style.cssText = 'position:absolute;left:50%;bottom:30px;transform:translateX(-50%);min-width:0;padding:4px 12px;pointer-events:none;z-index:9';
    el.textContent = msg;
    document.getElementById('app').appendChild(el);
    setTimeout(() => el.remove(), 1400);
  }
  App.flash = flash;

  function bindUi() {
    document.addEventListener('click', (e) => {
      DB.audio.ensure();
      const el = e.target.closest('[data-a]');
      if (!el) return;
      const fn = ACTIONS[el.dataset.a];
      if (fn) { DB.audio.ui('click'); fn(el); }
    });
    document.addEventListener('input', (e) => {
      const el = e.target;
      if (!el.dataset || !el.dataset.k) return;
      if (el.type === 'range') { const v = el.nextElementSibling; if (v) v.textContent = el.value; }
    });
    document.addEventListener('change', (e) => {
      const el = e.target;
      if (!el.dataset || !el.dataset.k) return;
      onSetting(el.dataset.k, el.value);
      if (el.type !== 'text') showScreen(App.screen, App.screenArg);
    });
    $('#tbQuick').onclick = () => { DB.audio.ui('click'); quickMatch(); };
    $('#tbMenu').onclick = () => {
      DB.audio.ui('click');
      if (App.screen === 'editor') { DB.editor.close(); return; }
      if (App.match && !App.demo) showScreen(App.screen === 'pause' ? null : 'pause');
      else showScreen('main');
    };
    $('#tbFocus').onclick = () => requestFocus();
    $('#focusHint').onclick = () => requestFocus();
    $('#tbMin').onclick = () => DB.native.post('minimize') || flash('Minimize works in the macOS app');
    $('#tbHide').onclick = () => DB.native.post('hide') || flash('Hide works in the macOS app');
    document.querySelectorAll('#toolbar .sizes button').forEach((b) => {
      b.onclick = () => { onSetting('desktop.size', b.dataset.size); if (App.screen === 'settings') showScreen('settings'); };
    });
    $('#drag').addEventListener('mousedown', (e) => { e.preventDefault(); DB.native.post('dragStart'); });
    $('#grip').addEventListener('mousedown', (e) => { e.preventDefault(); DB.native.post('resizeStart'); });
    // clicking the arena itself gives the game focus (when the window catches the click)
    document.getElementById('game').addEventListener('mousedown', () => { if (!App.focused) requestFocus(); });
    window.addEventListener('keydown', onKeyDown, { capture: true });
    window.addEventListener('keyup', onKeyUp, { capture: true });
    window.addEventListener('blur', () => setFocused(false));
    window.addEventListener('focus', () => setFocused(true));
    document.addEventListener('visibilitychange', () => { App.hidden = document.hidden; if (document.hidden) releaseAllKeys(); });
    window.addEventListener('resize', resize);
    DB.native.on((e) => {
      if (e.type === 'focus') setFocused(true);
      else if (e.type === 'blur') setFocused(false);
      else if (e.type === 'hidden') { App.hidden = true; releaseAllKeys(); }
      else if (e.type === 'shown') { App.hidden = false; }
      else if (e.type === 'command') {
        if (e.name === 'quick') quickMatch();
        else if (e.name === 'menu') { if (App.match && !App.demo) showScreen('pause'); else showScreen('main'); }
        else if (e.name === 'settings') showScreen('settings');
        else if (e.name === 'editor') ACTIONS.editor();
      } else if (e.type === 'size') {
        App.settings.desktop.width = e.width; App.settings.desktop.height = e.height;
        if (e.preset) App.settings.desktop.size = e.preset;
        DB.store.set('settings', App.settings);
      }
    });
    // keep the click-through regions fresh
    setInterval(() => reportRects(), 500);
  }

  // ------------------------------------------------------------------- boot ----
  function boot() {
    App.settings = loadSettings();
    App.settings.controls = Object.assign({ wasd: true }, App.settings.controls || {});
    loadCustomMaps();
    App.renderer = new DB.Renderer($('#game'));
    DB.audio.init(App.settings.audio);
    bindUi();
    resize();
    applySettings();
    showScreen('main');
    startDemo();
    requestAnimationFrame(frame);
    DB.native.post('ready', { desktop: App.settings.desktop });
    // test hooks: ?quick, ?map=<id>, ?spectate=<id>
    const q = new URLSearchParams(location.search);
    if (q.has('nopause')) App.noBlurPause = true;
    if (q.has('quick')) quickMatch();
    if (q.get('map')) startMatch({ mapId: q.get('map'), rotation: false });
    if (q.get('spectate')) startMatch({ mapId: q.get('spectate'), rotation: false, spectate: true, bots: +(q.get('bots') || 6), difficulty: +(q.get('level') || 3) });
    if (q.get('screen')) showScreen(q.get('screen'), q.get('arg'));
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(window);

</script>
</body>
</html>
