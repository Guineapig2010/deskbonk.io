<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desktop Bonk</title>
<style>
/* Desktop Bonk — the page background is fully transparent: the desktop shows through. */
:root {
  --panel: rgba(18, 21, 31, 0.93);
  --panel-2: rgba(36, 41, 58, 0.95);
  --line: rgba(255, 255, 255, 0.14);
  --text: #f1f3f9;
  --muted: #a7aec2;
  --accent: #ffd23f;
  --accent-2: #4aa8ff;
  --danger: #ff5a5a;
  --ok: #5ee08a;
  --tb-h: 26px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; color: var(--text);
  font: 12px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  -webkit-user-select: none; user-select: none; }
#app { position: fixed; inset: 0; }
#game { position: absolute; left: 0; top: 0; }
.hidden { display: none !important; }
button { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px;
  padding: 3px 8px; cursor: pointer; }
button:hover { background: #3a4260; }
button:active { transform: translateY(1px); }
button.primary { background: var(--accent); color: #1b1b1b; border-color: #e2b500; font-weight: 700; }
button.primary:hover { background: #ffe066; }
button.sel { outline: 2px solid var(--accent); outline-offset: -1px; }

/* toolbar */
#toolbar { position: absolute; left: 50%; top: 2px; transform: translateX(-50%); height: var(--tb-h); display: flex; align-items: center; gap: 4px;
  padding: 2px 5px; background: rgba(16, 18, 27, 0.78); border: 1px solid var(--line); border-radius: 9px; white-space: nowrap;
  opacity: 0.72; transition: opacity .15s; box-shadow: 0 2px 10px rgba(0,0,0,.25); }
#toolbar:hover { opacity: 1; }
#toolbar button { padding: 1px 7px; height: 20px; font-size: 11px; }
#toolbar .sizes { display: inline-flex; gap: 1px; }
#toolbar .sizes button { padding: 1px 5px; }
#drag { cursor: grab; padding: 0 4px; font-size: 15px; color: var(--muted); }
#drag:active { cursor: grabbing; }
#title { font-weight: 800; letter-spacing: .08em; font-size: 10px; color: var(--accent); padding-right: 2px; }
body.playing #toolbar { opacity: 0.4; }
body.playing #toolbar:hover { opacity: 1; }
body.compact #title, body.compact #tbFocus .lbl { display: none; }

/* resize grip */
#grip { position: absolute; right: 1px; bottom: 1px; width: 16px; height: 16px; cursor: nwse-resize; opacity: .55;
  background: linear-gradient(135deg, transparent 50%, rgba(255,255,255,.75) 50%, rgba(255,255,255,.75) 58%, transparent 58%, transparent 70%, rgba(255,255,255,.75) 70%, rgba(255,255,255,.75) 78%, transparent 78%); }
#grip:hover { opacity: 1; }

/* HUD */
#hud { position: absolute; inset: 0; pointer-events: none; }
#scores { position: absolute; left: 6px; top: calc(var(--tb-h) + 8px); display: flex; flex-direction: column; gap: 2px; }
.chip { display: flex; align-items: center; gap: 5px; padding: 1px 7px 1px 3px; border-radius: 10px; background: rgba(10,12,18,.66);
  font-size: 11px; font-weight: 600; text-shadow: 0 1px 1px #000; width: max-content; }
.chip .dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid rgba(0,0,0,.7); }
.chip.dead { opacity: .45; text-decoration: line-through; }
.chip.me { box-shadow: inset 0 0 0 1px rgba(255,242,122,.7); }
.chip .pips { letter-spacing: 1px; color: var(--accent); }
#mapName { position: absolute; right: 8px; top: calc(var(--tb-h) + 8px); font-size: 10.5px; color: #fff; background: rgba(10,12,18,.6);
  padding: 1px 7px; border-radius: 8px; text-shadow: 0 1px 1px #000; }
#center { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); text-align: center; }
.big { font-size: 46px; font-weight: 900; color: #fff; -webkit-text-stroke: 2px rgba(0,0,0,.75); text-shadow: 0 3px 0 rgba(0,0,0,.35); letter-spacing: .02em; }
.banner { background: rgba(14,16,24,.88); border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px; box-shadow: 0 6px 24px rgba(0,0,0,.35); min-width: 220px; }
.banner h2 { margin: 0 0 4px; font-size: 18px; }
.banner .sub { color: var(--muted); font-size: 11px; }
.banner .row { display: flex; gap: 6px; justify-content: center; margin-top: 8px; pointer-events: auto; }
.banner table { margin: 6px auto 0; border-collapse: collapse; font-size: 11px; }
.banner td { padding: 1px 6px; text-align: left; }
#heavy { position: absolute; left: 8px; bottom: 8px; width: 64px; height: 9px; border-radius: 5px; background: rgba(10,12,18,.7); border: 1px solid rgba(255,255,255,.35); overflow: hidden; }
#heavy span { position: absolute; left: 0; right: 0; top: -1px; font-size: 8px; text-align: center; font-weight: 800; color: #000; mix-blend-mode: normal; }
#heavyFill { height: 100%; width: 100%; background: linear-gradient(90deg, #fff, #ffe66b); }
#heavy.active { box-shadow: 0 0 0 2px #fff; }
#hint { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); font-size: 11px; background: rgba(10,12,18,.66); padding: 2px 9px; border-radius: 9px; text-shadow: 0 1px 1px #000; white-space: nowrap; transition: opacity .4s; }
#focusHint { position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); pointer-events: auto; cursor: pointer; background: rgba(255,210,63,.95); color: #1a1a1a; padding: 3px 10px; border-radius: 9px; font-size: 11px; white-space: nowrap; box-shadow: 0 2px 10px rgba(0,0,0,.35); }

/* panels / menus */
#panel { position: absolute; left: 50%; top: calc(var(--tb-h) + 10px); transform: translateX(-50%); width: min(560px, calc(100% - 16px));
  max-height: calc(100% - var(--tb-h) - 18px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 14px; box-shadow: 0 10px 36px rgba(0,0,0,.45); }
#panel h1 { font-size: 20px; margin: 0 0 2px; letter-spacing: .06em; font-weight: 900; color: var(--accent); }
#panel h3 { font-size: 12px; margin: 12px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
#panel .tag { color: var(--muted); margin-bottom: 10px; }
.quick { display: block; width: 100%; font-size: 20px; font-weight: 900; letter-spacing: .08em; padding: 12px; border-radius: 10px; margin: 6px 0 4px; }
.quick small { display: block; font-size: 10.5px; font-weight: 600; letter-spacing: 0; opacity: .75; }
.menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 6px; margin-top: 8px; }
.menu-grid button { padding: 8px 6px; }
.form { display: grid; grid-template-columns: max-content 1fr; gap: 6px 12px; align-items: center; }
.form label { color: var(--muted); }
.seg { display: flex; flex-wrap: wrap; gap: 3px; }
.seg button { padding: 2px 8px; }
select, input[type=number], input[type=text] { font: inherit; color: var(--text); background: #232838; border: 1px solid var(--line); border-radius: 5px; padding: 2px 5px; }
input[type=range] { width: 100%; accent-color: var(--accent); }
input[type=text] { -webkit-user-select: text; user-select: text; }
.val { color: var(--accent); font-variant-numeric: tabular-nums; margin-left: 6px; }
.tabs { display: flex; gap: 4px; margin: 8px 0; }
.tabs button.sel { background: var(--accent); color: #111; }
.foot { display: flex; gap: 6px; justify-content: flex-end; margin-top: 12px; flex-wrap: wrap; }
.maps { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 7px; }
.map { background: #1d2130; border: 1px solid var(--line); border-radius: 8px; padding: 4px; cursor: pointer; text-align: left; }
.map:hover { border-color: var(--accent); }
.map.sel { outline: 2px solid var(--accent); }
.map img { width: 100%; aspect-ratio: 3 / 2; display: block; border-radius: 5px; background: #111; }
.map b { display: block; font-size: 11px; margin-top: 3px; }
.map span { display: block; font-size: 9.5px; color: var(--muted); line-height: 1.25; height: 2.5em; overflow: hidden; }
.kbd { display: inline-block; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; font-size: 10px; background: #262b3c; }
.help { color: var(--muted); font-size: 11px; line-height: 1.6; }
.note { color: var(--muted); font-size: 10.5px; }
.persona { font-size: 10px; color: var(--muted); }

/* editor */
#editorBar { position: absolute; left: 4px; right: 4px; top: calc(var(--tb-h) + 6px); display: flex; gap: 3px; flex-wrap: wrap; pointer-events: auto; }
#editorBar button { padding: 2px 6px; font-size: 11px; }
#editorProps { position: absolute; right: 4px; top: calc(var(--tb-h) + 62px); width: 178px; max-height: calc(100% - var(--tb-h) - 70px); overflow: auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 7px; pointer-events: auto; font-size: 11px; }
#editorProps .form { grid-template-columns: 64px 1fr; gap: 4px 6px; }
#editorProps input[type=number], #editorProps select, #editorProps input[type=text] { width: 100%; }
#editorStatus { position: absolute; left: 6px; bottom: 6px; font-size: 10.5px; background: rgba(10,12,18,.75); padding: 2px 8px; border-radius: 8px; pointer-events: none; }

</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>
  <div id="toolbar" class="ia">
    <div id="drag" title="Drag to move the arena">⠿</div>
    <span id="title">DESKTOP&nbsp;BONK</span>
    <button id="tbQuick" title="Quick Match (Enter)">▶ Quick</button>
    <button id="tbMenu" title="Menu (Esc)">☰</button>
    <button id="tbFocus" title="Give keyboard focus to the game">⌨ Focus</button>
    <span class="sizes"><button data-size="small" title="Small arena">S</button><button data-size="medium" title="Medium arena">M</button><button data-size="large" title="Large arena">L</button></span>
    <button id="tbMin" title="Minimize to a floating launcher">–</button>
    <button id="tbHide" title="Hide (global shortcut)">×</button>
  </div>
  <div id="hud">
    <div id="scores"></div>
    <div id="mapName"></div>
    <div id="center"></div>
    <div id="heavy" title="Heavy effectiveness"><div id="heavyFill"></div><span>X</span></div>
    <div id="hint"></div>
    <div id="focusHint" class="ia hidden">Keyboard is with another app — <b>click here</b> to play</div>
  </div>
  <div id="panel" class="ia hidden"></div>
  <div id="grip" class="ia" title="Drag to resize"></div>
</div>

  // Fill in defaults so maps can be terse.

    const map = U.deepClone(m);

    const w = map.view.w, h = map.view.h;
    map.bounds = Object.assign({ left: -4, right: w + 4, top: -30, bottom: h + 4 }, map.bounds || {});
    map.gravity = map.gravity || [0, 1];

    map.joints = map.joints || [];
    map.spawns = map.spawns || [];
    map.events = map.events || [];
    map.ai = map.ai || {};
    let n = 0;
    for (const b of map.bodies) {
      if (!b.id) b.id = 'b' + n;
      n++;

      b.x = b.x || 0; b.y = b.y || 0; b.a = b.a || 0;

  function v2(x, y) { return planck.Vec2(x, y); }

  // Expand an editor/map shape definition into primitive fixture geometries (body-local).
  function expandShape(s) {
    const out = [];

      const c = Math.cos(a), sn = Math.sin(a);

    };

      const a = U.deg(s.a || 0), hw = s.w / 2, hh = s.h / 2, ox = s.x || 0, oy = s.y || 0;
      out.push({ kind: 'poly', pts: [rot(-hw, -hh, a, ox, oy), rot(hw, -hh, a, ox, oy), rot(hw, hh, a, ox, oy), rot(-hw, hh, a, ox, oy)] });
    } else if (s.t === 'circle') {
      out.push({ kind: 'circle', cx: s.x || 0, cy: s.y || 0, r: s.r });
    } else if (s.t === 'poly') {
      const pieces = U.convexDecompose(s.pts, 8);

  // Path evaluation for kinematic path-followers. Returns position at time t.

      const n = path.mode === 'loop' ? pts.length : pts.length - 1;

        const p1 = pathPos(d.path, t + dt);
        const p = b.getPosition();
        b.setLinearVelocity(v2((p1[0] - p.x) / dt, (p1[1] - p.y) / dt));

      const I = b.getInertia();
      const pivot = cfg.pivot;
      const c = b.getWorldCenter();
      const h = -(c.y - pivot[1]); // height above pivot (y down)
      const g = env.phys.gravity;
      const dCom = Math.hypot(c.x - pivot[0], c.y - pivot[1]);
      const lv = b.getLinearVelocity();
      const E = 0.5 * b.getMass() * (lv.x * lv.x + lv.y * lv.y) + 0.5 * I * w * w + b.getMass() * g * h;
      const target = -g * dCom * Math.cos(U.deg(cfg.amp)) * b.getMass();
      if (E < target && Math.abs(w) > 0.05) b.applyTorque(U.sign(w) * cfg.torque, true);
      else if (Math.abs(w) <= 0.05 && E < target * 0.3) b.applyTorque(cfg.torque, true);
    }
    for (const d of env.drifters) {
      const b = d.body, cfg = d.cfg;
      const p = b.getPosition();
      const tt = t * (cfg.speed || 0.35) + d.seed;
      const hx = d.home[0] + Math.sin(tt * 1.3) * (cfg.range || 6);
      const hy = d.home[1] + Math.cos(tt * 0.9) * (cfg.range || 6) * 0.5;
      const m = b.getMass();
      const vel = b.getLinearVelocity();
      b.applyForceToCenter(v2((hx - p.x) * (cfg.k || 1.5) * m - vel.x * m * 0.6, (hy - p.y) * (cfg.k || 1.5) * m - vel.y * m * 0.6), true);

  };

<script>
// One round of play: the physics world, the players' circular bodies, game-mode rules,
// eliminations and round results. Humans and bots both drive players through `player.input`
// — there is exactly one movement/collision code path for everyone.
(function (root) {
  'use strict';
  const DB = root.DB;
  const U = DB.util;
  const C = DB.CONST;
  const v2 = (x, y) => planck.Vec2(x, y);

  function emptyInput() { return { left: false, right: false, up: false, down: false, heavy: false, special: false }; }
  DB.emptyInput = emptyInput;

  class Sim {
    constructor(opts) {
      this.mode = opts.mode || 'classic';
      this.phys = opts.phys;
      this.mapDef = opts.map;
      this.rng = U.rng(opts.seed || 1);
      this.env = DB.buildWorld(opts.map, this.phys, { mode: this.mode });
      this.map = this.env.map;
      this.world = this.env.world;
      this.time = 0;
      this.events = [];        // drained by the presentation layer (sounds/effects)
      this.result = null;
      this.players = [];
      this.arrows = [];
      this.ball = null;
      this.goals = [];
      this.pendingKills = [];
      this.pendingImpulses = [];
      this.removeQueue = [];
      this.prev = new Map();
      this.teamsMode = this.mode === 'teams' || this.mode === 'football';
      this.footballScore = null;
      this._hitCooldown = new Map();
      this._setupContacts();
      this._spawnPlayers(opts.players);
      if (this.mode === 'football') this._setupFootball();
      this.snapshot();
    }

    // ---- setup -------------------------------------------------------------
    _spawnPlayers(list) {
      let spawns = (this.map.spawns || []).map((s) => s.slice());
      if (spawns.length === 0) spawns = [[this.map.view.w / 2, 5]];
      const order = this.rng.shuffle(spawns.map((_, i) => i));
      let teamSpawns = null;
      if (this.teamsMode) {
        // left half -> team 1 (red), right half -> team 2 (blue)
        const sorted = spawns.map((s, i) => i).sort((a, b) => spawns[a][0] - spawns[b][0]);
        const half = Math.ceil(sorted.length / 2);
        teamSpawns = { 1: this.rng.shuffle(sorted.slice(0, half)), 2: this.rng.shuffle(sorted.slice(half)) };
        if (this.map.teamSpawns) teamSpawns = { 1: this.map.teamSpawns[1].map((_, i) => 'a' + i), 2: this.map.teamSpawns[2].map((_, i) => 'b' + i) };
      }
      const used = { 1: 0, 2: 0 };
      list.forEach((pd, i) => {
        let sp;
        if (teamSpawns && pd.team) {
          const arr = teamSpawns[pd.team];
          const k = arr[used[pd.team]++ % arr.length];
          if (typeof k === 'string') {
            const ts = this.map.teamSpawns[pd.team][parseInt(k.slice(1), 10)];
            sp = ts;
          } else sp = spawns[k];
          // if more players than spawns on a side, offset slightly upward
          if (used[pd.team] > arr.length) sp = [sp[0], sp[1] - 2.2 * Math.floor((used[pd.team] - 1) / arr.length)];
        } else {
          sp = spawns[order[i % order.length]];
          if (i >= order.length) sp = [sp[0], sp[1] - 2.2 * Math.floor(i / order.length)];
        }
        this.players.push(this._makePlayer(pd, sp));
      });
    }

    _makePlayer(pd, sp) {
      const R = C.PLAYER_RADIUS;
      const body = this.world.createBody({
        type: 'dynamic', position: v2(sp[0], sp[1]), bullet: true,
        linearDamping: this.phys.linearDamping, angularDamping: this.phys.angularDamping,
      });
      const baseDensity = 1 / (Math.PI * R * R); // mass = 1 at normal weight
      const fx = body.createFixture({
        shape: planck.Circle(R), density: baseDensity,
        friction: this.phys.playerFriction * this.phys.frictionMul,
        restitution: Math.min(1, this.phys.playerRestitution * this.phys.restitutionMul),
        filterCategoryBits: C.CAT_PLAYER, filterMaskBits: 0xffff & ~C.CAT_OBJWALL,
      });
      const p = {
        id: pd.id, name: pd.name, color: pd.color, pattern: pd.pattern || 'solid', team: pd.team || 0,
        isBot: !!pd.isBot, isHuman: !!pd.isHuman,
        body, fixture: fx, baseDensity, radius: R,
        alive: true, deathTime: 0, deathPos: null,
        input: emptyInput(), prevSpecial: false,
        heavyEnergy: 1, heavy: false, massMul: 1,
        facing: 1, aim: -0.6, charge: 0, charging: false, cooldown: 0,
        rope: null, ropeTime: 0, kickFlash: 0,
        lastHitBy: null, lastHitTime: -99,
        spawn: sp.slice(),
      };
      body.setUserData({ kind: 'player', player: p });
      fx.setUserData({ kind: 'player', player: p });
      return p;
    }

    _setupFootball() {
      const m = this.map;
      const b = m.ball || { x: m.view.w / 2, y: m.view.h / 2, r: 1.3 };
      const body = this.world.createBody({ type: 'dynamic', position: v2(b.x, b.y), bullet: true, linearDamping: 0.25, angularDamping: 0.4 });
      body.createFixture({
        shape: planck.Circle(b.r), density: 0.6 / (Math.PI * b.r * b.r), friction: 0.4, restitution: 0.55,
        filterCategoryBits: C.CAT_BALL, filterMaskBits: 0xffff,
      }).setUserData({ kind: 'ball' });
      body.setUserData({ kind: 'ball' });
      this.ball = { body, r: b.r, start: [b.x, b.y] };
      for (const g of m.goals || []) {
        const gb = this.world.createBody({ type: 'static', position: v2(g.x, g.y) });
        gb.createFixture({ shape: planck.Box(g.w / 2, g.h / 2), isSensor: true }).setUserData({ kind: 'goal', team: g.team });
        this.goals.push(g);
      }
    }

    _setupContacts() {
      const self = this;
      const kindOf = (f) => { const u = f.getUserData(); return u ? u.kind : null; };
      this.world.on('pre-solve', (contact) => {
        const fa = contact.getFixtureA(), fb = contact.getFixtureB();
        const ua = fa.getUserData(), ub = fb.getUserData();
        // ball-to-ball contacts are nearly frictionless (otherwise touching rolling balls jam like gears)
        if (ua && ub && ua.kind === 'player' && ub.kind === 'player') { contact.setFriction(0.04); contact.setRestitution(self.phys.bounceRestitution != null ? self.phys.bounceRestitution : 0.7); }
        // no wall-clinging: contacts against steep walls are slippery for balls
        if (ua && ub && (ua.kind === 'player') !== (ub.kind === 'player') && (ua.kind === 'world' || ub.kind === 'world')) {
          const wm = contact.getWorldManifold(null);
          if (wm) {
            const g = self.env.gravityDir;
            const gl = Math.hypot(g[0], g[1]) || 1;
            if (Math.abs(wm.normal.x * g[0] + wm.normal.y * g[1]) / gl < 0.45) contact.setFriction(0.03);
          }
        }
        // arrows don't hit their shooter for a moment after firing
        for (const [u, o] of [[ua, ub], [ub, ua]]) {
          if (u && u.kind === 'arrow' && o && o.kind === 'player' && o.player === u.arrow.owner && self.time - u.arrow.born < 0.3) contact.setEnabled(false);
          if (u && u.kind === 'arrow' && u.arrow.dead) contact.setEnabled(false);
        }
      });
      this.world.on('begin-contact', (contact) => {
        const fa = contact.getFixtureA(), fb = contact.getFixtureB();
        const ua = fa.getUserData() || {}, ub = fb.getUserData() || {};
        const pairs = [[ua, ub, fa, fb, 1], [ub, ua, fb, fa, -1]];
        for (const [u, o, fu, fo, sgn] of pairs) {
          if (u.kind === 'player') {
            const p = u.player;
            if (o.lethal && self.mode !== 'football') self.pendingKills.push(p);
            if (o.bumper) {
              const wm = contact.getWorldManifold(null);
              if (wm) {
                // manifold normal points from A to B
                let nx = wm.normal.x * -sgn, ny = wm.normal.y * -sgn;
                self.pendingImpulses.push({ body: p.body, x: nx * o.bumper, y: ny * o.bumper });
                self.events.push({ type: 'bumper', x: p.body.getPosition().x, y: p.body.getPosition().y });
              }
            }
            if (o.kind === 'player') {
              p.lastHitBy = o.player; p.lastHitTime = self.time;
            }
            if (o.kind === 'arrow' && !o.arrow.dead && o.arrow.owner !== p) {
              p.lastHitBy = o.arrow.owner; p.lastHitTime = self.time;
              o.arrow.dead = true; o.arrow.hitPlayer = true;
              self.events.push({ type: 'arrowhit', x: p.body.getPosition().x, y: p.body.getPosition().y });
            }
          }
          if (u.kind === 'arrow' && o.kind !== 'player' && !fo.isSensor()) {
            u.arrow.stuck = true;
          }
          if (u.kind === 'ball' && o.kind === 'goal' && !self.result) {
            self._goal(o.team);
          }
        }
      });
      this.world.on('post-solve', (contact, impulse) => {
        const fa = contact.getFixtureA(), fb = contact.getFixtureB();
        const ka = kindOf(fa), kb = kindOf(fb);
        if (ka !== 'player' && kb !== 'player' && ka !== 'ball' && kb !== 'ball') return;
        let imp = 0;
        for (let i = 0; i < impulse.normalImpulses.length; i++) imp = Math.max(imp, impulse.normalImpulses[i]);
        if (imp < 2.2) return;
        const key = (fa.__id || (fa.__id = Math.random())) + (fb.__id || (fb.__id = Math.random()));
        const last = self._hitCooldown.get(key) || -1;
        if (self.time - last < 0.12) return;
        self._hitCooldown.set(key, self.time);
        const wm = contact.getWorldManifold(null);
        const pt = wm && wm.points[0] ? wm.points[0] : fa.getBody().getPosition();
        self.events.push({ type: 'hit', x: pt.x, y: pt.y, strength: imp, pp: ka === 'player' && kb === 'player' });
      });
    }

    // ---- per-step ------------------------------------------------------------
    snapshot() {
      // previous transforms for render interpolation
      for (let b = this.world.getBodyList(); b; b = b.getNext()) {
        if (b.isStatic()) continue;
        const p = b.getPosition();
        let s = this.prev.get(b);
        if (!s) { s = { x: 0, y: 0, a: 0 }; this.prev.set(b, s); }
        s.x = p.x; s.y = p.y; s.a = b.getAngle();
      }
    }

    alivePlayers() { return this.players.filter((p) => p.alive); }

    step(dt) {
      if (this.result && this.result.final) return;
      this.snapshot();
      const ph = this.phys;
      DB.updateMechanisms(this.env, dt, this.events);
      for (const p of this.players) if (p.alive) this._applyPlayer(p, dt);
      if (this.mode === 'arrows') this._updateArrows(dt);
      for (const im of this.pendingImpulses) im.body.applyLinearImpulse(v2(im.x, im.y), im.body.getWorldCenter(), true);
      this.pendingImpulses.length = 0;

      this.world.step(dt, C.VEL_ITERS, C.POS_ITERS);
      DB.postStepMechanisms(this.env, dt, this.events);
      this.time += dt;

      for (const b of this.removeQueue) this.world.destroyBody(b);
      this.removeQueue.length = 0;

      // speed sanity clamp (prevents runaway impulses from ever producing absurd launches)
      for (const p of this.players) {
        if (!p.alive) continue;
        const v = p.body.getLinearVelocity();
        const s = Math.hypot(v.x, v.y);
        if (s > 75) p.body.setLinearVelocity(v2((v.x / s) * 75, (v.y / s) * 75));
        if (!isFinite(s)) this.pendingKills.push(p);
      }

      // eliminations: lethal contacts + leaving the arena boundary in any direction
      const B = this.map.bounds;
      for (const p of this.players) {
        if (!p.alive) continue;
        const pos = p.body.getPosition();
        if (this.mode !== 'football' && (pos.x < B.left || pos.x > B.right || pos.y < B.top || pos.y > B.bottom)) this.pendingKills.push(p);
        if (this.mode === 'football') {
          // keep footballers in play: respawn if they somehow leave
          if (pos.x < B.left || pos.x > B.right || pos.y < B.top || pos.y > B.bottom) {
            p.body.setPosition(v2(p.spawn[0], p.spawn[1])); p.body.setLinearVelocity(v2(0, 0));
          }
        }
      }
      for (const p of this.pendingKills) this._eliminate(p);
      this.pendingKills.length = 0;

      if (this.ball && !this.result) {
        const bp = this.ball.body.getPosition();
        if (bp.x < B.left || bp.x > B.right || bp.y > B.bottom || bp.y < B.top) {
          this.ball.body.setPosition(v2(this.ball.start[0], this.ball.start[1]));
          this.ball.body.setLinearVelocity(v2(0, 0));
        }
      }
      this._checkRoundEnd();
    }

    _applyPlayer(p, dt) {
      const ph = this.phys;
      const inp = p.input;
      const body = p.body;
      // --- heavy mechanic ---
      const wantHeavy = !!inp.heavy;
      if (wantHeavy) {
        p.heavyEnergy = Math.max(0, p.heavyEnergy - ph.heavyDrain * dt);
      } else {
        p.heavyEnergy = Math.min(1, p.heavyEnergy + ph.heavyRecover * dt);
      }
      const targetMul = wantHeavy ? ph.heavyMinMass + (ph.heavyMass - ph.heavyMinMass) * p.heavyEnergy : 1;
      p.heavy = wantHeavy;
      if (Math.abs(targetMul - p.massMul) > 0.02) {
        p.massMul = targetMul;
        p.fixture.setDensity(p.baseDensity * targetMul);
        body.resetMassData();
      }
      // --- movement forces (identical for humans and bots) ---
      const m0 = 1; // base mass; force does NOT grow with heavy mass -> heavy is less agile
      const fScale = wantHeavy ? ph.heavyForceScale : 1;
      let fx = 0, fy = 0;
      const dx = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
      const dy = (inp.down ? 1 : 0) - (inp.up ? 1 : 0);
      if (dx !== 0) p.facing = dx;
      let moveLocked = false;
      if (this.mode === 'arrows') moveLocked = this._arrowsInput(p, dt);
      else if (this.mode === 'grapple') this._grappleInput(p, dt);
      else if (this.mode === 'football') this._kickInput(p, dt);
      if (!moveLocked) {
        fx = dx * ph.moveAccel * m0 * fScale;
        if (dy < 0) fy = -ph.upAccel * m0 * fScale;
        else if (dy > 0) fy = ph.downAccel * m0 * fScale;
        if (fx || fy) body.applyForceToCenter(v2(fx, fy), true);
      }
      p.prevSpecial = !!inp.special;
      if (p.cooldown > 0) p.cooldown -= dt;
      if (p.kickFlash > 0) p.kickFlash -= dt;
    }

    // ---- Arrows mode ---------------------------------------------------------
    _arrowsInput(p, dt) {
      const inp = p.input;
      if (inp.special && p.cooldown <= 0) {
        if (!p.charging) { p.charging = true; p.charge = 0; p.aim = p.facing > 0 ? -0.5 : Math.PI + 0.5; }
        p.charge = Math.min(1, p.charge + dt / 0.9);
        // aim with left/right (rotate), up/down also rotate toward up/down
        const rotSpeed = 2.6;
        if (inp.left) p.aim -= rotSpeed * dt;
        if (inp.right) p.aim += rotSpeed * dt;
        return true; // movement locked while drawing the bow
      }
      if (!inp.special && p.charging) {
        p.charging = false;
        this._fireArrow(p);
        p.cooldown = 0.35;
        p.charge = 0;
      }
      return false;
    }

    _fireArrow(p) {
      const mine = this.arrows.filter((a) => a.owner === p && !a.dead);
      if (mine.length >= 3) { mine[0].dead = true; }
      const dir = v2(Math.cos(p.aim), Math.sin(p.aim));
      const pos = p.body.getPosition();
      const speed = 16 + 30 * p.charge;
      const start = v2(pos.x + dir.x * (p.radius + 0.7), pos.y + dir.y * (p.radius + 0.7));
      const ab = this.world.createBody({ type: 'dynamic', position: start, angle: p.aim, bullet: true, angularDamping: 2 });
      const fx = ab.createFixture({ shape: planck.Box(0.55, 0.09), density: 2.2, friction: 0.3, restitution: 0.1,
        filterCategoryBits: C.CAT_ARROW, filterMaskBits: 0xffff & ~C.CAT_OBJWALL & ~C.CAT_ARROW });
      const pv = p.body.getLinearVelocity();
      ab.setLinearVelocity(v2(pv.x + dir.x * speed, pv.y + dir.y * speed));
      const arrow = { body: ab, owner: p, born: this.time, dead: false, stuck: false, stuckTime: 0 };
      fx.setUserData({ kind: 'arrow', arrow });
      ab.setUserData({ kind: 'arrow', arrow });
      this.arrows.push(arrow);
      // recoil: equal and opposite momentum
      const m = ab.getMass();
      p.body.applyLinearImpulse(v2(-dir.x * speed * m * C.ARROW_RECOIL, -dir.y * speed * m * C.ARROW_RECOIL), p.body.getWorldCenter(), true);
      this.events.push({ type: 'shoot', x: pos.x, y: pos.y, strength: p.charge });
    }

    _updateArrows(dt) {
      for (const a of this.arrows) {
        if (a.removed) continue;
        const age = this.time - a.born;
        if (a.stuck) a.stuckTime += dt;
        if (!a.dead && !a.stuck) {
          // align arrow with its flight path (simple aerodynamic stabilisation)
          const v = a.body.getLinearVelocity();
          if (v.x * v.x + v.y * v.y > 4) {
            const target = Math.atan2(v.y, v.x);
            let d = target - a.body.getAngle();
            d = Math.atan2(Math.sin(d), Math.cos(d));
            a.body.setAngularVelocity(d * 12);
          }
        }
        if (a.dead || a.stuckTime > 0.8 || age > 5) {
          a.removed = true;
          this.removeQueue.push(a.body);
        }
      }
      this.arrows = this.arrows.filter((a) => !a.removed);
    }

    // ---- Grapple mode --------------------------------------------------------
    _grappleInput(p, dt) {
      const inp = p.input;
      if (inp.special && !p.prevSpecial && !p.rope && p.cooldown <= 0) this._shootRope(p);
      if (p.rope) {
        p.ropeTime += dt;
        const j = p.rope.joint;
        let L = j.getMaxLength();
        if (inp.up) L = Math.max(2.2, L - 11 * dt);
        if (inp.down) L = Math.min(24, L + 8 * dt);
        j.setMaxLength(L);
        if (!inp.special || p.ropeTime > 3.2 || !p.rope.body.isActive()) this._releaseRope(p);
      }
    }

    _shootRope(p) {
      const inp = p.input;
      let dx = (inp.right ? 1 : 0) - (inp.left ? 1 : 0), dy = (inp.down ? 1 : 0) - (inp.up ? 1 : 0);
      if (dx === 0 && dy === 0) { dx = p.facing * 0.55; dy = -1; }
      const l = Math.hypot(dx, dy); dx /= l; dy /= l;
      const pos = p.body.getPosition();
      const hit = this.raycastWorld(pos, v2(pos.x + dx * 24, pos.y + dy * 24), true);
      p.cooldown = 0.5;
      if (!hit) { this.events.push({ type: 'ropemiss', x: pos.x, y: pos.y, dx, dy }); p.ropeMiss = { t: this.time, dx, dy }; return; }
      const anchorLocal = hit.body.getLocalPoint(hit.point);
      const j = this.world.createJoint(planck.RopeJoint({ maxLength: Math.max(2.2, hit.dist), localAnchorA: v2(0, 0), localAnchorB: anchorLocal }, p.body, hit.body));
      p.rope = { joint: j, body: hit.body, local: anchorLocal };
      p.ropeTime = 0;
      this.events.push({ type: 'rope', x: hit.point.x, y: hit.point.y });
    }

    _releaseRope(p) {
      if (!p.rope) return;
      try { this.world.destroyJoint(p.rope.joint); } catch (e) { /* already gone */ }
      p.rope = null;
      p.cooldown = 0.6;
    }

    // ---- Football ------------------------------------------------------------
    _kickInput(p, dt) {
      const inp = p.input;
      if (inp.special && !p.prevSpecial && p.cooldown <= 0 && this.ball) {
        p.cooldown = 0.45;
        p.kickFlash = 0.15;
        const bp = this.ball.body.getPosition(), pp = p.body.getPosition();
        const dx = bp.x - pp.x, dy = bp.y - pp.y, d = Math.hypot(dx, dy);
        if (d < p.radius + this.ball.r + 1.1) {
          const s = 7 / Math.max(0.01, d);
          this.ball.body.applyLinearImpulse(v2(dx * s, dy * s - 0.6), this.ball.body.getWorldCenter(), true);
          p.body.applyLinearImpulse(v2(-dx * s * 0.2, -dy * s * 0.2), p.body.getWorldCenter(), true);
          this.events.push({ type: 'kick', x: bp.x, y: bp.y });
        }
      }
    }

    _goal(team) {
      // team = goal owner; the *other* team scores
      const scorer = team === 1 ? 2 : 1;
      this.result = { type: 'team', team: scorer, goal: true, time: this.time };
      this.events.push({ type: 'goal', team: scorer });
    }

    // ---- elimination & results -------------------------------------------------
    _eliminate(p) {
      if (!p.alive) return;
      p.alive = false;
      p.deathTime = this.time;
      const pos = p.body.getPosition();
      p.deathPos = { x: U.clamp(pos.x, 0, this.map.view.w), y: U.clamp(pos.y, 0, this.map.view.h) };
      if (p.rope) this._releaseRope(p);
      let killer = null;
      if (p.lastHitBy && this.time - p.lastHitTime < 4 && p.lastHitBy !== p) killer = p.lastHitBy;
      p.killedBy = killer;
      this.events.push({ type: 'eliminated', player: p, killer, x: p.deathPos.x, y: p.deathPos.y });
      this.world.destroyBody(p.body);
    }

    _checkRoundEnd() {
      if (this.result) return;
      const alive = this.alivePlayers();
      if (this.mode === 'football') {
        if (this.time > C.ROUND_TIME_LIMIT) this.result = { type: 'draw', time: this.time };
        return;
      }
      if (this.mode === 'teams') {
        const teams = new Set(alive.map((p) => p.team));
        if (teams.size <= 1) this.result = teams.size === 1 ? { type: 'team', team: [...teams][0], time: this.time } : { type: 'draw', time: this.time };
      } else if (this.players.length > 1 && alive.length <= 1) {
        this.result = alive.length === 1 ? { type: 'player', player: alive[0], time: this.time } : { type: 'draw', time: this.time };
      } else if (this.players.length === 1 && alive.length === 0) {
        this.result = { type: 'draw', time: this.time };
      }
      if (!this.result && this.time > C.ROUND_TIME_LIMIT) this.result = { type: 'draw', timeout: true, time: this.time };
      // Overtime: after a while the side kill-boundaries close in, so every round ends.
      if (!this.result && this.time > C.OVERTIME_START) {
        const B = this.map.bounds, cx = this.map.view.w / 2;
        if (!this.overtime) { this.overtime = true; this.events.push({ type: 'overtime' }); }
        const v = C.OVERTIME_SPEED * (1 / 60);
        B.left = Math.min(cx - 1.2, B.left + v);
        B.right = Math.max(cx + 1.2, B.right - v);
      }
    }

    // ---- queries (used by bots, grapple & renderer) ----------------------------
    // Closest hit on solid level geometry (ignores players, arrows, balls, sensors, decor).
    raycastWorld(p1, p2, includeDynamic) {
      let best = null;
      this.world.rayCast(p1, p2, (fixture, point, normal, fraction) => {
        if (fixture.isSensor()) return -1;
        const u = fixture.getUserData();
        if (!u || u.kind !== 'world') return -1;
        const cat = fixture.getFilterCategoryBits();
        if (cat === C.CAT_OBJWALL || cat === C.CAT_DECOR) return -1;
        if (!includeDynamic && fixture.getBody().isDynamic() && !u.def.platform) { /* still count dynamic platforms */ }
        best = { fixture, body: fixture.getBody(), point: v2(point.x, point.y), normal: v2(normal.x, normal.y), fraction, lethal: u.lethal };
        return fraction;
      });
      if (best) best.dist = Math.hypot(best.point.x - p1.x, best.point.y - p1.y);
      return best;
    }

    interp(body, alpha) {
      const p = body.getPosition();
      const s = this.prev.get(body);
      if (!s) return { x: p.x, y: p.y, a: body.getAngle() };
      let da = body.getAngle() - s.a;
      return { x: s.x + (p.x - s.x) * alpha, y: s.y + (p.y - s.y) * alpha, a: s.a + da * alpha };
    }
  }

  DB.Sim = Sim;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
// The 30 built-in maps (+ football pitches). Every map is plain data consumed by DB.buildWorld.
// Coordinates: metres, origin top-left, +y is DOWN. Standard view is 60 x 40.
// Body types: static | kinematic (path / piston / spin / swing) | dynamic (+ joints).
(function (root) {
  'use strict';
  const DB = root.DB;
  const U = DB.util;

  // ---- tiny authoring helpers (they only produce data) -------------------------
  let uid = 0;
  const id = (p) => (p || 'b') + (++uid);
  const box = (x, y, w, h, o) => Object.assign({ id: id('box'), type: 'static', x, y, shapes: [{ t: 'box', w, h }] }, o || {});
  const circ = (x, y, r, o) => Object.assign({ id: id('cir'), type: 'static', x, y, shapes: [{ t: 'circle', r }] }, o || {});
  const poly = (pts, o) => Object.assign({ id: id('pol'), type: 'static', x: 0, y: 0, shapes: [{ t: 'poly', pts }] }, o || {});
  // thick slab between two points (sloped platform)
  const slab = (x1, y1, x2, y2, th, o) => {
    const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy);
    const nx = -dy / L, ny = dx / L; // normal pointing "down" for left->right
    return poly([[x1, y1], [x2, y2], [x2 + nx * th, y2 + ny * th], [x1 + nx * th, y1 + ny * th]], o);
  };
  const on = (top, xs) => xs.map((x) => [x, top - 1.6]);
  const slopeY = (x1, y1, x2, y2, x) => y1 + ((y2 - y1) * (x - x1)) / (x2 - x1);

  const maps = [];
  const add = (m) => { maps.push(m); return m; };

  // ============================== CLASSIC =====================================
  add({
    id: 'flatline', name: 'Flatline', category: 'Classic',
    desc: 'One long platform over the void with two small raised blocks hanging near the edges — bounce off them for surprise hits. Pure movement and heavy timing.',
    bodies: [
      box(30, 26, 46, 2, { id: 'floor' }),
      box(11, 20.6, 3.2, 1.2), box(49, 20.6, 3.2, 1.2),
    ],
    spawns: on(25, [14, 18.5, 23, 27.5, 32.5, 37, 41.5, 46]),
    ai: { tip: 'flat' },
  });
